<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone - Sticky & Autoplay</title>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #0f0f0f;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 56px;
            background-color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .nav-left, .nav-center {
            display: flex;
            align-items: center;
        }

        .menu-icon {
            font-size: 18px;
            cursor: pointer;
            margin-right: 16px;
        }

        .logo {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .nav-center {
            flex: 0 1 600px;
        }

        .nav-center input {
            width: 100%;
            height: 40px;
            padding: 0 16px;
            border: 1px solid #ccc;
            border-radius: 40px 0 0 40px;
            font-size: 16px;
            outline: none;
        }

        .nav-center button {
            height: 40px;
            width: 64px;
            background-color: #f8f8f8;
            border: 1px solid #ccc;
            border-left: none;
            border-radius: 0 40px 40px 0;
            cursor: pointer;
            font-size: 16px;
            color: #333;
        }

        .nav-center button:hover {
            background-color: #f0f0f0;
        }

        /* Layout Utama dengan Grid agar Sticky berfungsi sempurna */
        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            padding: 24px;
            max-width: 1600px;
            margin: 0 auto;
            align-items: start; /* Penting agar elemen kiri bisa sticky mandiri */
        }

        /* Bagian Video Player (Sticky) */
        .video-section {
            position: sticky;
            top: 80px; /* Jarak dari atas navbar saat dishoot */
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio aspek 16:9 */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #main-video-title {
            font-size: 20px;
            font-weight: bold;
            margin-top: 12px;
        }

        .channel-title {
            font-size: 14px;
            color: #606060;
            margin: 6px 0 12px 0;
        }

        .video-desc {
            font-size: 14px;
            background-color: #f2f2f2;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-line;
            line-height: 1.4;
            max-height: 150px;
            overflow-y: auto;
        }

        /* Sidebar Daftar Video */
        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-card {
            display: flex;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
            padding: 4px;
        }

        .video-card:hover {
            background-color: #eaeaea;
        }

        /* Menandai video yang sedang aktif diputar */
        .video-card.active {
            background-color: #e5e5e5;
            border-left: 4px solid #ff0000;
            padding-left: 8px;
        }

        .video-card img {
            width: 168px;
            height: 94px;
            object-fit: cover;
            border-radius: 8px;
        }

        .video-info h4 {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-info p {
            font-size: 12px;
            color: #606060;
        }

        /* Responsif untuk Layar Kecil */
        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .video-section {
                position: relative;
                top: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <i class="fa-solid fa-bars menu-icon"></i>
            <h1 class="logo"><i class="fa-brands fa-youtube" style="color: #ff0000;"></i> MyTube</h1>
        </div>
        <div class="nav-center">
            <input type="text" id="search-input" placeholder="Telusuri...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>

    <!-- Konten Utama -->
    <div class="main-container">
        
        <!-- Bagian Pemutar Video & Detail (Kiri - Sticky) -->
        <div class="video-section" id="video-section" style="display: none;">
            <div class="video-container" id="player-container">
                <!-- Iframe akan di-inject via JS dengan YouTube IFrame API -->
                <div id="youtube-player"></div>
            </div>
            <h2 id="main-video-title">Judul Video Akan Tampil Disini</h2>
            <p id="main-video-channel" class="channel-title">Nama Channel</p>
            <p id="main-video-desc" class="video-desc">Deskripsi video akan muncul di sini...</p>
        </div>

        <!-- Bagian Daftar Video / Hasil Pencarian (Kanan) -->
        <div class="sidebar-section">
            <h3 id="sidebar-title">Rekomendasi / Hasil Pencarian</h3>
            <div id="video-list" class="video-list">
                <!-- Daftar video dimuat secara dinamis -->
            </div>
        </div>

    </div>

    <!-- YouTube IFrame API (Diperlukan untuk mendeteksi event video selesai / onStateChange) -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const API_KEY = "AIzaSyCrogZjjtH00X5MsDYs79ZCnB9ljI2bdRk";

        const searchInput = document.getElementById("search-input");
        const searchBtn = document.getElementById("search-btn");
        const videoListEl = document.getElementById("video-list");
        const videoSection = document.getElementById("video-section");
        const mainTitle = document.getElementById("main-video-title");
        const mainChannel = document.getElementById("main-video-channel");
        const mainDesc = document.getElementById("main-video-desc");

        let player;
        let currentVideos = []; // Menyimpan daftar hasil pencarian
        let currentIndex = 0;   // Menyimpan index video yang sedang diputar

        // Jalur inisialisasi YouTube IFrame API
        function onYouTubeIframeAPIReady() {
            // API siap digunakan
            searchVideos("Coding Indonesia");
        }

        // Event pencarian
        window.addEventListener("DOMContentLoaded", () => {
            // Fallback jika API belum sempat terpanggil
            if(typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
                setTimeout(() => {
                    if(currentVideos.length === 0) searchVideos("Coding Indonesia");
                }, 1000);
            }
        });

        searchBtn.addEventListener("click", () => {
            const query = searchInput.value.trim();
            if (query) searchVideos(query);
        });

        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                const query = searchInput.value.trim();
                if (query) searchVideos(query);
            }
        });

        // Ambil data video dari YouTube API v3
        async function searchVideos(query) {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    currentVideos = data.items;
                    currentIndex = 0;
                    displayVideos();
                    playVideoByIndex(currentIndex);
                } else {
                    videoListEl.innerHTML = "<p>Tidak ada video ditemukan.</p>";
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                alert("Terjadi kesalahan saat memuat video.");
            }
        }

        // Tampilkan daftar video ke sidebar
        function displayVideos() {
            videoListEl.innerHTML = "";

            currentVideos.forEach((video, index) => {
                const snippet = video.snippet;
                const card = document.createElement("div");
                card.classList.add("video-card");
                if (index === currentIndex) card.classList.add("active");

                card.innerHTML = `
                    <img src="${snippet.thumbnails.medium.url}" alt="${snippet.title}">
                    <div class="video-info">
                        <h4>${snippet.title}</h4>
                        <p>${snippet.channelTitle}</p>
                    </div>
                `;

                card.addEventListener("click", () => {
                    currentIndex = index;
                    playVideoByIndex(currentIndex);
                    updateActiveCardStyle();
                });

                videoListEl.appendChild(card);
            });
        }

        // Sorot video yang sedang aktif di sidebar
        function updateActiveCardStyle() {
            const cards = document.querySelectorAll(".video-card");
            cards.forEach((card, idx) => {
                if (idx === currentIndex) {
                    card.classList.add("active");
                } else {
                    card.classList.remove("active");
                }
            });
        }

        // Putar video berdasarkan index list
        function playVideoByIndex(index) {
            if (index < 0 || index >= currentVideos.length) return;
            
            videoSection.style.display = "block";
            const video = currentVideos[index];
            const videoId = video.id.videoId;
            const snippet = video.snippet;

            mainTitle.textContent = snippet.title;
            mainChannel.textContent = snippet.channelTitle;
            mainDesc.textContent = snippet.description || "Tidak ada deskripsi.";

            // Inisialisasi atau muat ulang player YouTube
            if (!player) {
                player = new YT.Player('youtube-player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1,
                        'controls': 1
                    },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
            } else {
                player.loadVideoById(videoId);
            }

            updateActiveCardStyle();
        }

        // Deteksi status pemutar video (Mendeteksi ketika video selesai: YT.PlayerState.ENDED)
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                // Video selesai, lanjut ke index berikutnya (Autoplay playlist)
                currentIndex++;
                if (currentIndex < currentVideos.length) {
                    playVideoByIndex(currentIndex);
                    // Scroll ke atas halaman list jika diperlukan agar selaras
                } else {
                    // Reset ke awal playlist jika sudah habis (opsional)
                    currentIndex = 0;
                    playVideoByIndex(currentIndex);
                }
            }
        }
    </script>
</body>
</html>

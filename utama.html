<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Control System - Index</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #f1f5f9;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 15px auto;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            display: none;
        }

        /* Table Styling */
        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: #111827;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
        }

        tr { transition: background 0.15s; cursor: pointer; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
        }
        .badge-ok { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-ng { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.25s ease-out;
        }

        @keyframes modalPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
        }
        .close-btn:hover { color: var(--text-primary); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: var(--text-secondary); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-primary); }

        .hint-text { font-size: 11px; color: #64748b; margin-top: 4px; display: block; }
    </style>
</head>
<body>
    <header>
        <h1>Manajemen Unit</h1>
        <p>Sistem input manual & pemindaian barcode terintegrasi dengan Google Spreadsheet.</p>
    </header>

    <div class="action-bar">
        <button onclick="openInputModal()">+ Input Manual</button>
        <button onclick="toggleScanner()" class="btn-success">📷 Scan Barcode Kamera</button>
    </div>

    <div id="reader"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>No Urut</th>
                    <th>Suffix</th>
                    <th>No Unit</th>
                    <th>Problem</th>
                </tr>
            </thead>
            <tbody id="tableData">
                <tr><td colspan="5" style="text-align:center; color: var(--text-secondary);">Memuat data dari server...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Input / Edit -->
<div id="inputModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="margin-top:0; font-size: 20px;">Form Input Data Unit</h2>
        <form id="unitForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="dataId">
            <div class="form-group">
                <label>Suffix (Karakter ke-6 & 5 dari belakang):</label>
                <input type="text" id="suffix" required placeholder="Otomatis / Manual">
            </div>
            <div class="form-group">
                <label>Nomer Unit (Karakter ke-12 s/d 17):</label>
                <input type="text" id="unitNo" required placeholder="Otomatis / Manual">
            </div>
            <div class="form-group">
                <label>Problem / Kendala:</label>
                <textarea id="problem" rows="3" required placeholder="Deskripsikan masalah..."></textarea>
            </div>
            <div class="form-group">
                <label>WIP Area:</label>
                <div class="radio-group">
                    <label><input type="radio" name="wip" value="WIP 1" checked> WIP</label>
                </div>
            </div>
            <div class="form-group">
                <label>Status Pemeriksaan:</label>
                <select id="status">
                    <option value="OK">OK</option>
                    <option value="NG">NG</option>
                </select>
            </div>
            <button type="submit" class="btn-success" style="width:100%; margin-top: 10px;">Simpan Data</button>
        </form>
    </div>
</div>

<!-- Modal Detail & Aksi (Klik & Klik Tahan) -->
<div id="actionModal" class="modal">
    <div class="modal-content" style="text-align: center;">
        <span class="close-btn" onclick="closeActionModal()">&times;</span>
        <h2 style="margin-top:0; font-size: 20px;">Informasi Detail Unit</h2>
        <div id="detailContent" style="text-align: left; margin: 20px 0; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 14px; line-height: 1.6;"></div>
        <div id="actionButtons" style="display:none; gap: 10px; justify-content: center;">
            <button onclick="editData()" class="btn-success" style="flex:1;">Edit Data</button>
            <button onclick="deleteData()" class="btn-danger" style="flex:1;">Hapus</button>
        </div>
        <p id="longPressHint" style="font-size: 12px; color: var(--text-secondary); margin-top: 15px;">*Tahan klik pada baris tabel untuk memunculkan tombol Edit & Hapus.</p>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby28sihhGYpIq96nWemrjRh4DW9yw3wqw3GMrW0YbvMA5DzqMbCoU08attU2q1KFCJa/exec';
    let allData = [];
    let selectedRowData = null;
    let html5QrCode = null;
    let scannerIsRunning = false;
    let pressTimer;

    document.addEventListener("DOMContentLoaded", fetchData);

    function fetchData() {
        fetch(API_URL + "?action=get")
            .then(res => res.json())
            .then(data => {
                allData = data;
                renderTable(data);
            })
            .catch(err => {
                console.error(err);
                document.getElementById("tableData").innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--danger);">Gagal memuat data dari server</td></tr>`;
            });
    }

    function renderTable(data) {
        const tbody = document.getElementById("tableData");
        tbody.innerHTML = "";
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-secondary);">Belum ada data tercatat</td></tr>`;
            return;
        }

        data.forEach((item, index) => {
            let tr = document.createElement("tr");
            let badgeClass = item.status === "OK" ? "badge-ok" : "badge-ng";
            
            tr.innerHTML = `
                <td><b>#${index + 1}</b></td>
                <td>${item.suffix || '-'}</td>
                <td><code>${item.unitNo || '-'}</code></td>
                <td>${item.problem || '-'}</td>
            `;

            tr.addEventListener("click", () => showDetail(item, false));

            // Long Press handler for edit/delete
            const triggerLongPress = () => {
                pressTimer = setTimeout(() => showDetail(item, true), 700);
            };
            const cancelLongPress = () => clearTimeout(pressTimer);

            tr.addEventListener("mousedown", triggerLongPress);
            tr.addEventListener("mouseup", cancelLongPress);
            tr.addEventListener("touchstart", triggerLongPress);
            tr.addEventListener("touchend", cancelLongPress);

            tbody.appendChild(tr);
        });
    }

    function openInputModal(suffix = "", unitNo = "") {
        document.getElementById("unitForm").reset();
        document.getElementById("dataId").value = "";
        document.getElementById("modalTitle").innerText = "Form Input Data Unit";
        document.getElementById("suffix").value = suffix;
        document.getElementById("unitNo").value = unitNo;
        document.getElementById("inputModal").style.display = "flex";
    }

    function closeModal() { document.getElementById("inputModal").style.display = "none"; }
    function closeActionModal() { document.getElementById("actionModal").style.display = "none"; }

    function showDetail(item, showActions) {
        selectedRowData = item;
        let badgeClass = item.status === 'OK' ? 'badge-ok' : 'badge-ng';
        let content = `
            <div style="margin-bottom:8px"><b>Suffix:</b> ${item.suffix}</div>
            <div style="margin-bottom:8px"><b>Nomor Unit:</b> ${item.unitNo}</div>
            <div style="margin-bottom:8px"><b>Problem:</b> ${item.problem}</div>
            <div style="margin-bottom:8px"><b>WIP Area:</b> ${item.wip}</div>
            <div style="margin-bottom:8px"><b>Status:</b> <span class="badge ${badgeClass}">${item.status}</span></div>
            <div style="color:var(--text-secondary); font-size:12px; margin-top:12px">Waktu: ${item.timestamp}</div>
        `;
        document.getElementById("detailContent").innerHTML = content;
        document.getElementById("actionButtons").style.display = showActions ? "flex" : "none";
        document.getElementById("longPressHint").style.display = showActions ? "none" : "block";
        document.getElementById("actionModal").style.display = "flex";
    }

    function editData() {
        closeActionModal();
        document.getElementById("modalTitle").innerText = "Edit Data Unit";
        document.getElementById("dataId").value = selectedRowData.id;
        document.getElementById("suffix").value = selectedRowData.suffix;
        document.getElementById("unitNo").value = selectedRowData.unitNo;
        document.getElementById("problem").value = selectedRowData.problem;
        document.querySelector(`input[name="wip"][value="${selectedRowData.wip}"]`).checked = true;
        document.getElementById("status").value = selectedRowData.status;
        document.getElementById("inputModal").style.display = "flex";
    }

    function deleteData() {
        if (confirm("Apakah Anda yakin ingin menghapus data unit ini?")) {
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "delete", id: selectedRowData.id })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                closeActionModal();
                fetchData();
            });
        }
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        const id = document.getElementById("dataId").value;
        const payload = {
            action: id ? "update" : "add",
            id: id,
            suffix: document.getElementById("suffix").value,
            unitNo: document.getElementById("unitNo").value,
            problem: document.getElementById("problem").value,
            wip: document.querySelector('input[name="wip"]:checked').value,
            status: document.getElementById("status").value
        };

        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            alert(res.message);
            closeModal();
            fetchData();
        });
    }

    function toggleScanner() {
        const readerDiv = document.getElementById("reader");
        if (!scannerIsRunning) {
            readerDiv.style.display = "block";
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                decodedText => {
                    processScannedCode(decodedText);
                    stopScanner();
                },
                errorMessage => {}
            ).catch(err => {
                alert("Gagal membuka kamera: " + err);
            });
            scannerIsRunning = true;
        } else {
            stopScanner();
        }
    }

    function stopScanner() {
        if (html5QrCode && scannerIsRunning) {
            html5QrCode.stop().then(() => {
                scannerIsRunning = false;
                document.getElementById("reader").style.display = "none";
            }).catch(err => console.log(err));
        }
    }

    function processScannedCode(code) {
        let unitNo = code.length >= 17 ? code.substring(11, 17) : code;
        let suffix = "";
        if (code.length >= 6) {
            suffix = code.charAt(code.length - 6) + code.charAt(code.length - 5);
        }
        openInputModal(suffix, unitNo);
    }
</script>

</body>
</html>

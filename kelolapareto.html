<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Problem Pareto</title>
    <!-- FontAwesome & Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- HTML5 QRCode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding-bottom: 90px; -webkit-touch-callout: none; user-select: none; }
        
        /* Sticky Top Card */
        .top-card {
            position: sticky; top: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white;
            padding: 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 100;
            display: flex; flex-direction: column; gap: 15px; cursor: pointer;
        }
        .header-title { font-size: 1.2rem; font-weight: 600; text-align: center; letter-spacing: 1px;}
        .date-shift { font-size: 0.85rem; text-align: center; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; align-self: center; }
        
        .stats-row { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .stat-box { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        .stat-box i { font-size: 1.5rem; color: #00f2fe; }
        
        .filter-btn {
            position: relative; background: rgba(255,255,255,0.2); padding: 10px;
            border-radius: 12px; cursor: pointer; border: none; color: white;
        }
        .badge {
            position: absolute; top: -5px; right: -5px; background: #ff4757;
            color: white; font-size: 0.7rem; font-weight: bold; width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }

        /* Container Pages */
        .page { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Item Cards */
        .data-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1e3c72; cursor: pointer;}
        .data-card h4 { color: #e74c3c; margin-bottom: 5px; }
        .data-card p { font-size: 0.9rem; color: #555; }
        .data-card .time { font-size: 0.75rem; color: #999; float: right; }

        /* Bottom Sticky Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: white; display: flex;
            justify-content: space-around; align-items: center; padding: 10px 0;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.1); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 100;
        }
        .nav-item { color: #a4b0be; font-size: 1.5rem; cursor: pointer; transition: 0.3s; padding: 10px; }
        .nav-item.active { color: #1e3c72; }
        
        .nav-scan {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white;
            width: 65px; height: 65px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 1.8rem;
            transform: translateY(-25px); box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            border: 5px solid #f0f4f8; cursor: pointer;
        }

        /* Modals */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-bottom: 15px; text-align: center; color: #1e3c72; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #666; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; }
        .btn-save { width: 100%; background: #1e3c72; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .close-scanner { background: #ff4757; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 600; }

        /* General Utilities */
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-wa { background: #25D366; color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .history-date { background: #1e3c72; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .history-content { display: none; margin-bottom: 15px; border-left: 2px solid #1e3c72; padding-left: 10px; }
        canvas { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        /* Status Loading */
        #sync-status { text-align: center; font-size: 0.75rem; color: #f1c40f; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Sticky Top Card dengan Fitur Long Press Buka Admin & Klik Judul Buka Home -->
    <div class="top-card" 
         onmousedown="startAdminPress()" onmouseup="cancelAdminPress()" onmouseleave="cancelAdminPress()" 
         ontouchstart="startAdminPress()" ontouchend="cancelAdminPress()" ontouchmove="cancelAdminPress()">
         
        <div class="header-title" onclick="event.stopPropagation(); navTo('home-page');">KELOLA PROBLEM PARETO</div>
        <div class="date-shift" id="display-date-shift">Menghubungkan ke Server...</div>
        <div id="sync-status"></div>
        <div class="stats-row">
            <div class="stat-box">
                <i class="fas fa-car"></i>
                <div>
                    <div style="font-size: 0.7rem; color: #ccc;">Total Unit </div>
                    <strong id="total-unit">0</strong>
                </div>
            </div>
            <button class="filter-btn" onclick="event.stopPropagation(); navTo('pareto-page')">
                <i class="fas fa-filter"></i>
                <div class="badge" id="pareto-badge">0</div>
            </button>
        </div>
        <div style="text-align: center; font-size: 0.6rem; color: rgba(255,255,255,0.5); margin-top: -5px;"></div>
    </div>

    <!-- MAIN DISPLAY (HOME - HANYA SHIFT INI) -->
    <div id="home-page" class="page active">
        <h3 style="margin-bottom: 15px; color: #333;">Data Input</h3>
        <div id="home-display">
            <p style="text-align:center; color:#999;">Memuat data dari server...</p>
        </div>
    </div>

    <!-- PARETO PAGE -->
    <div id="pareto-page" class="page">
        <div class="header-action">
            <h3>Data Pareto Shift Ini</h3>
            <a href="#" class="btn-wa" onclick="sendWA()"><i class="fab fa-whatsapp"></i> Kirim WA</a>
        </div>
        <div id="pareto-display"></div>
    </div>

    <!-- HISTORY PAGE (SEMUA DATA, DIKELOMPOKKAN TANGGAL & SHIFT) -->
    <div id="history-page" class="page">
        <h3 style="margin-bottom: 15px;">History Seluruh Input</h3>
        <div id="history-display"></div>
    </div>

    <!-- CHART PAGE -->
    <div id="chart-page" class="page">
        <h3 style="margin-bottom: 15px;">Grafik Pareto</h3>
        <canvas id="paretoChart"></canvas>
    </div>

    <!-- ADMIN PAGE (SEMUA DATA) -->
    <div id="admin-page" class="page">
        <div class="header-action">
            <h3>Halaman Admin</h3>
            <button onclick="navTo('home-page')" style="background:#1e3c72;color:white;padding:8px 15px;border-radius:8px;border:none;cursor:pointer;">Tutup</button>
        </div>
        <p style="font-size: 0.8rem; color: #666; margin-bottom: 15px;"><i></i></p>
        <div id="admin-display"></div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="navTo('history-page', this)"><i class="fas fa-history"></i></div>
        <div class="nav-scan" onclick="openScanner()"><i class="fas fa-barcode"></i></div>
        <div class="nav-item" onclick="navTo('chart-page', this)"><i class="fas fa-chart-pie"></i></div>
    </div>

    <!-- MODAL SCANNER -->
    <div class="modal" id="modal-scanner" style="display: flex; visibility: hidden; opacity: 0; transition: 0.2s;">
        <div class="modal-content">
            <h3>Scan Barcode</h3>
            <div id="reader"></div>
            <button class="close-scanner" onclick="closeScanner()">Batal</button>
        </div>
    </div>

    <!-- MODAL INPUT BARU -->
    <div class="modal" id="modal-input" style="display: flex; visibility: hidden; opacity: 0; transition: 0.2s;">
        <div class="modal-content">
            <h3>Input Problem</h3>
            <div class="input-group">
                <label>Suffix</label>
                <input type="text" id="in-suffix" readonly>
            </div>
            <div class="input-group">
                <label>Nomor Unit</label>
                <input type="text" id="in-unit" readonly>
            </div>
            <div class="input-group">
                <label>Problem</label>
                <input type="text" id="in-problem" placeholder="Ketik problem di sini..." autocomplete="off">
            </div>
            <button class="btn-save" id="btn-save-input" onclick="saveData()">Simpan Data</button>
            <button class="close-scanner" style="background: #ccc; color: #333; margin-top: 10px;" onclick="closeModalInput()">Batal</button>
        </div>
    </div>

    <!-- MODAL ACTION ADMIN -->
    <div class="modal" id="modal-action" style="display: flex; visibility: hidden; opacity: 0; transition: 0.2s;">
        <div class="modal-content" style="text-align: center;">
            <h3 style="margin-bottom: 20px;">Opsi Data</h3>
            <button class="btn-save" style="background: #3498db; color: white;" onclick="openEditModal()">Edit Data</button>
            <button class="btn-save" style="background: #e74c3c; color: white; margin-top: 10px;" onclick="deleteData()">Hapus Data</button>
            <button class="close-scanner" style="background: #ecf0f1; color: #333; margin-top: 15px;" onclick="closeActionModal()">Batal</button>
        </div>
    </div>

    <!-- MODAL EDIT ADMIN -->
    <div class="modal" id="modal-edit" style="display: flex; visibility: hidden; opacity: 0; transition: 0.2s;">
        <div class="modal-content">
            <h3>Edit Problem</h3>
            <input type="hidden" id="edit-id">
            <div class="input-group">
                <label>Suffix</label>
                <input type="text" id="edit-suffix">
            </div>
            <div class="input-group">
                <label>Nomor Unit</label>
                <input type="text" id="edit-unit">
            </div>
            <div class="input-group">
                <label>Problem</label>
                <input type="text" id="edit-problem" autocomplete="off">
            </div>
            <button class="btn-save" id="btn-save-edit" style="background: #27ae60;" onclick="saveEditData()">Update Data</button>
            <button class="close-scanner" style="background: #ccc; color: #333; margin-top: 10px;" onclick="closeEditModal()">Batal</button>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI JSONBIN.IO
        // ==========================================
        const BIN_ID = '6aded063ac6210605a520e79';     // Contoh: 652a1b...
        const API_KEY = '$2a$10$Ii1ep5GX66sB9lery6p2suxzNGrSMg2iwncn5Z2y/HT5WjaHRrf1q';   // Contoh: $2a$10$...
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let db = []; // Data awal kosong sebelum ditarik
        
        let html5QrcodeScanner;
        let chartInstance = null;
        let selectedDataId = null; 

        // ==========================================
        // FUNGSI API JSONBIN (BACA & TULIS)
        // ==========================================
        async function loadDataFromBin() {
            try {
                const response = await fetch(BIN_URL, {
                    method: 'GET',
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await response.json();
                
                // Menghindari error jika BIN masih kosong
                if (result.record && Array.isArray(result.record)) {
                    db = result.record;
                } else {
                    db = [];
                }
                
                document.getElementById('sync-status').innerText = "";
                updateTopCard();
                renderHome();
            } catch (error) {
                console.error(error);
                document.getElementById('display-date-shift').innerText = "Gagal memuat server!";
                document.getElementById('sync-status').innerText = "Cek koneksi atau API Key Anda.";
            }
        }

        async function syncToBin() {
            const statusEl = document.getElementById('sync-status');
            statusEl.innerText = "⏳ Menyimpan ke server...";
            try {
                await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(db)
                });
                statusEl.innerText = "✅ Tersimpan!";
                setTimeout(() => statusEl.innerText = "", 2000);
            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ Gagal menyimpan ke server!";
                alert("Perhatian: Data gagal disimpan ke server. Pastikan koneksi internet Anda stabil.");
            }
        }

        // ==========================================
        // FITUR LONG PRESS (ADMIN & DATA)
        // ==========================================
        let adminTimer;
        function startAdminPress() { adminTimer = setTimeout(() => navTo('admin-page'), 800); }
        function cancelAdminPress() { clearTimeout(adminTimer); }

        let dataTimer;
        function startDataPress(id) {
            dataTimer = setTimeout(() => {
                selectedDataId = id;
                const modal = document.getElementById('modal-action');
                modal.style.visibility = 'visible'; modal.style.opacity = '1';
                if(navigator.vibrate) navigator.vibrate(50);
            }, 600);
        }
        function cancelDataPress() { clearTimeout(dataTimer); }

        // ==========================================
        // FILTER DATA KHUSUS SHIFT & HARI INI
        // ==========================================
        function getCurrentShiftData() {
            const currentInfo = getShiftInfo();
            return db.filter(item => item.dateStr === currentInfo.dateString && item.shift === currentInfo.shiftName);
        }

        // ==========================================
        // FUNGSI SISTEM (SHIFT, PARETO LOGIC)
        // ==========================================
        function getShiftInfo() {
            const now = new Date();
            const h = now.getHours(); const m = now.getMinutes();
            const totalMinutes = (h * 60) + m;
            let shiftName = "Night"; let shiftDate = new Date(now);
            
            if (totalMinutes >= 435 && totalMinutes < 1155) { shiftName = "Day"; } 
            else if (totalMinutes < 435) { shiftDate.setDate(shiftDate.getDate() - 1); }
            
            const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            
            return { 
                dateString: `${days[shiftDate.getDay()]}, ${shiftDate.getDate()} ${months[shiftDate.getMonth()]} ${shiftDate.getFullYear()}`, 
                shiftName 
            };
        }

        function getParetoData(dataArray) {
            let grouped = {};
            dataArray.forEach(item => {
                const key = item.problem.toUpperCase();
                if(!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });
            let pareto = {};
            for (let prob in grouped) { if(grouped[prob].length >= 3) pareto[prob] = grouped[prob]; }
            return pareto;
        }

        // ==========================================
        // RENDER HALAMAN
        // ==========================================
        function updateTopCard() {
            const info = getShiftInfo();
            document.getElementById('display-date-shift').innerText = `${info.dateString} - ${info.shiftName} Shift`;
            
            const currentData = getCurrentShiftData();
            document.getElementById('total-unit').innerText = currentData.length;
            document.getElementById('pareto-badge').innerText = Object.keys(getParetoData(currentData)).length;
        }

        function navTo(pageId, elm) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            if(elm) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                elm.classList.add('active');
            } else {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            }

            if(pageId === 'home-page') renderHome();
            if(pageId === 'pareto-page') renderPareto();
            if(pageId === 'history-page') renderHistory();
            if(pageId === 'chart-page') renderChart();
            if(pageId === 'admin-page') renderAdmin();
        }

        function renderHome() {
            const container = document.getElementById('home-display');
            container.innerHTML = '';
            const currentData = getCurrentShiftData();
            
            if(currentData.length === 0) return container.innerHTML = '<p style="text-align:center; color:#999;">Belum ada data unit pada shift ini.</p>';
            
            const sortedDb = [...currentData].reverse();
            sortedDb.forEach(item => {
                container.innerHTML += `
                    <div class="data-card">
                        <span class="time">${item.time}</span>
                        <h4>${item.suffix} - ${item.unitNo} ${item.problem}</h4>
                    </div>
                `;
            });
        }

        function renderPareto() {
            const container = document.getElementById('pareto-display');
            container.innerHTML = '';
            const pareto = getParetoData(getCurrentShiftData());
            
            if(Object.keys(pareto).length === 0) return container.innerHTML = '<p style="text-align:center; color:#999;">Belum ada kelompok problem lebih dari 3 kali di shift ini.</p>';

            for (let prob in pareto) {
                let listHtml = '';
                pareto[prob].forEach(u => listHtml += `<p style="margin-left:10px;">- ${u.suffix} - ${u.unitNo}</p>`);
                container.innerHTML += `
                    <div class="data-card" style="border-left-color: #ff4757;">
                        <h4>${prob} <span style="color:#333; font-size:0.9rem;">(${pareto[prob].length} Unit)</span></h4>
                        ${listHtml}
                    </div>
                `;
            }
        }

        function renderChart() {
            const pareto = getParetoData(getCurrentShiftData());
            const ctx = document.getElementById('paretoChart').getContext('2d');
            const labels = Object.keys(pareto);
            const dataCounts = labels.map(l => pareto[l].length);

            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Jumlah Unit', data: dataCounts, backgroundColor: '#ff4757', borderRadius: 5
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        function renderHistory() {
            const container = document.getElementById('history-display');
            container.innerHTML = '';
            
            if(db.length === 0) return container.innerHTML = '<p style="text-align:center; color:#999;">Belum ada data history.</p>';

            let groupedDateShift = {};
            db.forEach(item => {
                const groupKey = `${item.dateStr} - Shift ${item.shift}`;
                if(!groupedDateShift[groupKey]) groupedDateShift[groupKey] = [];
                groupedDateShift[groupKey].push(item);
            });

            for (let groupKey in groupedDateShift) {
                const idDiv = 'hist-' + groupKey.replace(/[^a-zA-Z0-9]/g, '');
                let listHtml = '';
                groupedDateShift[groupKey].forEach(item => {
                    listHtml += `
                        <div class="data-card" style="margin-top:10px;">
                            <span class="time" style="font-size:0.75rem; color:#999; float:right;">${item.time}</span>
                            <h4>${item.suffix} - ${item.unitNo} ${item.problem}</h4>
                        </div>
                    `;
                });
                container.innerHTML += `
                    <div class="history-date" onclick="toggleHist('${idDiv}')">
                        <span style="font-size: 0.9rem;"><i class="fas fa-calendar-alt"></i> ${groupKey}</span>
                        <span style="font-size: 0.9rem;">${groupedDateShift[groupKey].length} Unit</span>
                    </div>
                    <div class="history-content" id="${idDiv}">
                        ${listHtml}
                    </div>
                `;
            }
        }
        
        function toggleHist(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function renderAdmin() {
            const container = document.getElementById('admin-display');
            container.innerHTML = '';
            if(db.length === 0) return container.innerHTML = '<p style="text-align:center; color:#999;">Belum ada data unit.</p>';
            
            const sortedDb = [...db].reverse();
            sortedDb.forEach(item => {
                container.innerHTML += `
                    <div class="data-card" 
                         onmousedown="startDataPress(${item.id})" onmouseup="cancelDataPress()" onmouseleave="cancelDataPress()" 
                         ontouchstart="startDataPress(${item.id})" ontouchend="cancelDataPress()" ontouchmove="cancelDataPress()">
                        <span class="time">${item.dateStr} | ${item.time}</span>
                        <h4>${item.suffix} - ${item.unitNo} ${item.problem}</h4>
                    </div>
                `;
            });
        }

        function sendWA() {
            const pareto = getParetoData(getCurrentShiftData());
            const info = getShiftInfo();
            let text = `*DATA UNIT PARETO*\nTanggal: ${info.dateString}\nShift: ${info.shiftName}\n\n`;
            
            for (let prob in pareto) {
                text += `*Problem: ${prob}* (${pareto[prob].length} unit)\n`;
                pareto[prob].forEach(u => text += `- ${u.suffix} - ${u.unitNo}\n`);
                text += `\n`;
            }
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        // ==========================================
        // LOGIKA ADMIN (EDIT/HAPUS) -> JSONBIN
        // ==========================================
        function closeActionModal() {
            const modal = document.getElementById('modal-action');
            modal.style.opacity = '0'; setTimeout(() => modal.style.visibility = 'hidden', 200);
        }
        
        async function deleteData() {
            if(confirm("Yakin ingin menghapus data problem ini?")) {
                db = db.filter(item => item.id !== selectedDataId);
                closeActionModal(); updateTopCard(); renderAdmin(); renderHome();
                await syncToBin(); // Simpan perubahan ke cloud
            }
        }

        function openEditModal() {
            const item = db.find(x => x.id === selectedDataId);
            if(item) {
                document.getElementById('edit-id').value = item.id;
                document.getElementById('edit-suffix').value = item.suffix;
                document.getElementById('edit-unit').value = item.unitNo;
                document.getElementById('edit-problem').value = item.problem;
                closeActionModal();
                const modalEdit = document.getElementById('modal-edit');
                modalEdit.style.visibility = 'visible'; modalEdit.style.opacity = '1';
            }
        }
        
        function closeEditModal() {
            const modalEdit = document.getElementById('modal-edit');
            modalEdit.style.opacity = '0'; setTimeout(() => modalEdit.style.visibility = 'hidden', 200);
        }
        
        async function saveEditData() {
            const id = parseInt(document.getElementById('edit-id').value);
            const suffix = document.getElementById('edit-suffix').value.toUpperCase();
            const unitNo = document.getElementById('edit-unit').value.toUpperCase();
            const problem = document.getElementById('edit-problem').value;
            
            if(!problem.trim()) return alert("Nama problem wajib diisi!");
            
            const index = db.findIndex(x => x.id === id);
            if(index !== -1) {
                db[index].suffix = suffix; db[index].unitNo = unitNo; db[index].problem = problem;
                
                closeEditModal(); updateTopCard(); renderAdmin(); renderHome();
                await syncToBin(); // Simpan perubahan ke cloud
                alert("Data berhasil diupdate!");
            }
        }

        // ==========================================
        // SCANNER DAN INPUT -> JSONBIN
        // ==========================================
        function openScanner() {
            const modal = document.getElementById('modal-scanner');
            modal.style.visibility = 'visible'; modal.style.opacity = '1';
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    processBarcode(decodedText);
                    html5QrcodeScanner.stop().then(() => {
                        modal.style.opacity = '0'; setTimeout(() => modal.style.visibility = 'hidden', 200);
                    }).catch(err => modal.style.visibility = 'hidden');
                }, (err) => { }
            ).catch(err => { alert("Kamera tidak dapat diakses."); closeScanner(); });
        }

        function closeScanner() {
            const modal = document.getElementById('modal-scanner');
            modal.style.opacity = '0'; setTimeout(() => modal.style.visibility = 'hidden', 200);
            if(html5QrcodeScanner) html5QrcodeScanner.stop().catch(e => console.log(e));
        }

        function processBarcode(code) {
            code = code.trim();
            let suffix = code; let unitNo = code;
            if(code.length >= 5) suffix = code.slice(-5, -3);
            if(code.length >= 17) unitNo = code.substring(11, 17);
            else if (code.length >= 12) unitNo = code.substring(11); 

            document.getElementById('in-suffix').value = suffix;
            document.getElementById('in-unit').value = unitNo;
            document.getElementById('in-problem').value = '';
            
            const modalInput = document.getElementById('modal-input');
            modalInput.style.visibility = 'visible'; modalInput.style.opacity = '1';
        }

        function closeModalInput() {
            const modal = document.getElementById('modal-input');
            modal.style.opacity = '0'; setTimeout(() => modal.style.visibility = 'hidden', 200);
        }

        async function saveData() {
            const suffix = document.getElementById('in-suffix').value;
            const unitNo = document.getElementById('in-unit').value;
            const problem = document.getElementById('in-problem').value;
            if(!problem.trim()) return alert("Nama problem wajib diisi!");

            const info = getShiftInfo();
            const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const newRecord = {
                id: Date.now(), suffix: suffix.toUpperCase(), unitNo: unitNo.toUpperCase(), problem: problem,
                dateStr: info.dateString, shift: info.shiftName, time: nowTime
            };
            
            db.push(newRecord);
            
            // Tutup modal dan langsung perbarui layar (Optimistic Update)
            closeModalInput(); 
            updateTopCard(); 
            navTo('home-page');

            // Proses simpan ke cloud berjalan di belakang layar
            await syncToBin(); 
        }

        // ==========================================
        // INISIALISASI (LOAD DATA SAAT APLIKASI DIBUKA)
        // ==========================================
        window.onload = () => {
            // Memuat data dari server JSONBin, lalu memproses UI setelahnya
            loadDataFromBin();
        };
    </script>
</body>
</html>

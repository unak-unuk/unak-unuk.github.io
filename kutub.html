<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuCup</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-xl font-bold tracking-wider text-rose-500 flex items-center gap-2">
                🎧 YU CUP
            </h1>
            <!-- Search & Genre Form -->
            <form id="searchForm" class="flex w-full sm:w-auto gap-2">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Cari genre atau artis (cth: Pop, Rock, Jazz)..." 
                    class="bg-slate-900 border border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-rose-500 flex-grow sm:w-72"
                    required
                >
                <button 
                    type="submit" 
                    class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    Cari
                </button>
            </form>
        </div>
    </header>

    <!-- Main Content / Video Grid -->
    <main class="max-w-4xl mx-auto w-full px-4 flex-grow pb-12">
        <div id="loading" class="text-center py-12 hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-rose-500 border-t-transparent"></div>
            <p class="text-sm text-slate-400 mt-2">Memuat daftar musik...</p>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Hasil pencarian akan dirender di sini secara dinamis -->
            <div class="col-span-full text-center py-16 text-slate-500">
                <p>Silakan ketik genre atau klik tombol kategori di atas untuk mulai memutar musik.</p>
            </div>
        </div>
    </main>

    <!-- Modal Video Player -->
    <div id="playerModal" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-2 sm:p-4">
        <div id="modalContainer" class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-3xl overflow-hidden shadow-2xl relative flex flex-col max-h-[95vh]">
            
            <!-- Header Modal -->
            <div id="modalHeader" class="flex items-center justify-between p-3 border-b border-slate-700 bg-slate-800 transition-all duration-300">
                <h3 id="modalTitle" class="text-sm font-medium truncate pr-4 text-slate-200">Memutar Video</h3>
                <div class="flex items-center gap-2">
                    <button onclick="toggleFullScreen()" class="text-slate-300 hover:text-white text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition flex items-center gap-1">
                        ⛶
                    </button>
                    <button onclick="closePlayer()" class="text-slate-400 hover:text-white font-bold text-xl px-2">&times;</button>
                </div>
            </div>

            <!-- Area Pemutar Video -->
            <div class="relative w-full bg-black flex-shrink-0" style="padding-bottom: 56.25%;">
                <iframe id="youtubePlayer" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <!-- Bagian Saran Video & Tombol Toggle Autoplay -->
            <div id="suggestionSection" class="p-3 bg-slate-900 overflow-y-auto flex-grow transition-all duration-300">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Saran Video Selanjutnya:</p>
                    <!-- Tombol Fitur Autoplay Next -->
                    <button id="autoPlayBtn" onclick="toggleAutoPlay()" class="text-xs px-2.5 py-1 rounded-full font-medium transition bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700">
                        Autoplay: <span id="autoPlayStatus" class="text-rose-400">OFF</span>
                    </button>
                </div>
                <div id="suggestionList" class="flex flex-col gap-2">
                    <!-- Item saran video akan masuk secara dinamis di sini -->
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-xs text-slate-500">
        Powered by YouTube Data API v3 &bull; Gratis Selamanya
    </footer>

    <!-- JavaScript Logika API -->
    <script>
        const API_KEY = "AIzaSyCrogZjjtH00X5MsDYs79ZCnB9ljI2bdRk";

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const videoGrid = document.getElementById('videoGrid');
        const loading = document.getElementById('loading');
        const playerModal = document.getElementById('playerModal');
        const youtubePlayer = document.getElementById('youtubePlayer');
        const modalTitle = document.getElementById('modalTitle');
        const modalHeader = document.getElementById('modalHeader');
        const suggestionSection = document.getElementById('suggestionSection');
        const suggestionList = document.getElementById('suggestionList');
        const autoPlayBtn = document.getElementById('autoPlayBtn');
        const autoPlayStatus = document.getElementById('autoPlayStatus');

        let currentVideoItems = []; 
        let currentIndex = 0;
        let isAutoPlayOn = false; // Status awal Autoplay OFF

        // Event listener form pencarian
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) fetchYouTubeMusic(query);
        });

        function searchGenre(genreName) {
            searchInput.value = genreName;
            fetchYouTubeMusic(genreName);
        }

        async function fetchYouTubeMusic(keyword) {
            loading.classList.remove('hidden');
            videoGrid.innerHTML = '';

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(keyword + ' official music video')}&type=video&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.error) {
                    alert('Gagal memuat API: ' + data.error.message);
                    return;
                }

                if (data.items && data.items.length > 0) {
                    currentVideoItems = data.items;
                    renderVideos(data.items);
                } else {
                    videoGrid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Tidak ada hasil ditemukan untuk "${keyword}".</div>`;
                }
            } catch (err) {
                loading.classList.add('hidden');
                console.error(err);
                alert('Terjadi kesalahan jaringan saat mengambil data.');
            }
        }

        function renderVideos(items) {
            videoGrid.innerHTML = '';
            items.forEach((item, index) => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const channelTitle = item.snippet.channelTitle;
                const thumbnail = item.snippet.thumbnails.medium.url;

                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 rounded-xl overflow-hidden hover:border-rose-500 transition cursor-pointer flex flex-col';
                card.onclick = () => openPlayer(videoId, title, index);

                card.innerHTML = `
                    <div class="relative aspect-video bg-slate-900 overflow-hidden">
                        <img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                            <span class="bg-rose-600 text-white rounded-full p-3 shadow-lg">▶</span>
                        </div>
                    </div>
                    <div class="p-3 flex flex-col flex-grow">
                        <h4 class="text-sm font-semibold text-slate-200 line-clamp-2 mb-1">${title}</h4>
                        <p class="text-xs text-slate-400 mt-auto">${channelTitle}</p>
                    </div>
                `;
                videoGrid.appendChild(card);
            });
        }

        function openPlayer(videoId, title, index) {
            currentIndex = index;
            modalTitle.innerText = title;
            
            // Tambahkan parameter enablejsapi=1 agar kita bisa mendeteksi kapan video selesai (ended)
            youtubePlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
            playerModal.classList.remove('hidden');
            playerModal.classList.add('flex');

            renderSuggestions(currentIndex);
        }

        // Toggle fitur Autoplay On/Off
        function toggleAutoPlay() {
            isAutoPlayOn = !isAutoPlayOn;
            if (isAutoPlayOn) {
                autoPlayStatus.innerText = "ON";
                autoPlayStatus.className = "text-emerald-400 font-bold";
                autoPlayBtn.classList.add('border-emerald-500');
            } else {
                autoPlayStatus.innerText = "OFF";
                autoPlayStatus.className = "text-rose-400 font-bold";
                autoPlayBtn.classList.remove('border-emerald-500');
            }
        }

        // Listener pesan dari iframe YouTube untuk mendeteksi saat video selesai diputar
        window.addEventListener('message', function(event) {
            if (!isAutoPlayOn) return;
            try {
                let data = JSON.parse(event.data);
                // State 0 di YouTube IFrame API artinya video telah selesai (ENDED)
                if (data.event === 'infoDelivery' && data.info && data.info.playerState === 0) {
                    playNextVideo();
                }
            } catch (e) {
                // Abaikan pesan lain yang bukan format JSON pemutar YouTube
            }
        });

        // Putar video berikutnya secara otomatis
        function playNextVideo() {
            if (currentVideoItems.length === 0) return;
            // Geser index ke video berikutnya (jika di ujung, kembali ke awal)
            currentIndex = (currentIndex + 1) % currentVideoItems.length;
            const nextItem = currentVideoItems[currentIndex];
            openPlayer(nextItem.id.videoId, nextItem.snippet.title, currentIndex);
        }

        function renderSuggestions(activeIndex) {
            suggestionList.innerHTML = '';
            currentVideoItems.forEach((item, index) => {
                if (index === activeIndex) return;

                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const channelTitle = item.snippet.channelTitle;
                const thumbnail = item.snippet.thumbnails.medium.url;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center gap-3 p-2 bg-slate-800 hover:bg-slate-700 rounded-lg cursor-pointer transition border border-slate-700/50';
                itemDiv.onclick = () => openPlayer(videoId, title, index);

                itemDiv.innerHTML = `
                    <img src="${thumbnail}" alt="${title}" class="w-20 h-12 object-cover rounded flex-shrink-0">
                    <div class="flex flex-col overflow-hidden">
                        <h5 class="text-xs font-medium text-slate-200 truncate">${title}</h5>
                        <p class="text-[10px] text-slate-400">${channelTitle}</p>
                    </div>
                    <span class="ml-auto text-rose-500 text-xs font-semibold px-2">Putar</span>
                `;
                suggestionList.appendChild(itemDiv);
            });
        }

        function closePlayer() {
            youtubePlayer.src = '';
            playerModal.classList.remove('flex');
            playerModal.classList.add('hidden');
            
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }

        function toggleFullScreen() {
            const modalContainer = document.getElementById('modalContainer');

            if (!document.fullscreenElement) {
                if (modalContainer.requestFullscreen) {
                    modalContainer.requestFullscreen();
                } else if (modalContainer.webkitRequestFullscreen) {
                    modalContainer.webkitRequestFullscreen();
                }

                modalHeader.classList.add('hidden');
                suggestionSection.classList.add('hidden');

                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(err => console.log("Orientasi terkunci manual"));
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                modalHeader.classList.remove('hidden');
                suggestionSection.classList.remove('hidden');

                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });

        playerModal.addEventListener('click', (e) => {
            if (e.target === playerModal) {
                closePlayer();
            }
        });
    </script>
</body>
</html>

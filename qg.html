<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Repair Kendaraan - Pelanggan</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }
        header p { color: #64748b; font-size: 0.9rem; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--secondary); }
        .btn { background-color: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background-color: #1e293b; }
        .result-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; background: #fafaf9; margin-top: 15px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-process { background: #e0f2fe; color: #0369a1; }
        .badge-qc { background: #f3e8ff; color: #7e22ce; }
        .badge-done { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Cek Status Perbaikan Mobil</h1>
        <p>Masukkan Nomor Kendaraan (Nopol) Anda untuk melihat progres di bengkel</p>
    </header>

    <div class="search-box">
        <input type="text" id="search-nopol" placeholder="Contoh: B 1234 XYZ">
        <button class="btn" onclick="cariStatus()">Cek Status</button>
    </div>

    <div id="result-container">
        <!-- Hasil pencarian muncul di sini -->
    </div>
</div>

<script>
    function cariStatus() {
        const query = document.getElementById('search-nopol').value.toUpperCase().trim();
        const container = document.getElementById('result-container');

        if (!query) {
            container.innerHTML = `<p style="color: var(--danger); text-align: center; margin-top: 15px;">Mohon masukkan nomor kendaraan terlebih dahulu.</p>`;
            return;
        }

        // Mengambil data dari localStorage (Catatan: Admin dan Pelanggan harus di browser yang sama, 
        // atau gunakan backend/JSON terpisah jika diakses dari perangkat pelanggan yang berbeda).
        let units = JSON.parse(localStorage.getItem('repair_units')) || [];
        const found = units.filter(u => u.nopol.includes(query));

        if (found.length === 0) {
            container.innerHTML = `
                <div class="result-card" style="border-left: 4px solid var(--danger);">
                    <h3 style="color: var(--danger);">Kendaraan Tidak Ditemukan</h3>
                    <p style="font-size: 0.9rem; color: #64748b; margin-top: 5px;">Nomor kendaraan "<strong>${query}</strong>" tidak terdaftar atau perbaikan telah selesai.</p>
                </div>
            `;
            return;
        }

        let html = '';
        found.forEach(u => {
            let badge = 'badge-pending';
            if (u.status === 'Sedang Dikerjakan') badge = 'badge-process';
            else if (u.status.includes('Quality Control')) badge = 'badge-qc';
            else if (u.status.includes('Selesai')) badge = 'badge-done';

            html += `
                <div class="result-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h3 style="color: var(--primary);">${u.nopol} <span style="font-size: 0.9rem; font-weight: normal; color: #64748b;">(${u.model})</span></h3>
                        <span class="badge ${badge}">${u.status}</span>
                    </div>
                    <p style="font-size: 0.9rem; font-weight: 600; margin-bottom: 4px;">Keluhan / Catatan Perbaikan:</p>
                    <p style="background: white; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.95rem;">${u.issue}</p>
                </div>
            `;
        });

        container.innerHTML = html;
    }
</script>
</body>
</html>

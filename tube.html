<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Web Player Mobile Responsive</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            overflow-x: hidden;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Tombol Hamburger dengan Animasi Menjadi X */
        .menu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 1100;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #f1f1f1;
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }

        /* Animasi Hamburger berubah menjadi 'X' */
        .menu-toggle.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            color: #fff;
            text-decoration: none;
        }

        .logo i {
            color: #ff0000;
            font-size: 22px;
        }

        /* Search Box */
        .search-container {
            display: flex;
            flex-grow: 1;
            max-width: 600px;
            margin: 0 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            width: 100%;
            height: 40px;
        }

        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .search-btn {
            background: #222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            width: 50px;
            height: 40px;
            cursor: pointer;
            color: #aaa;
            font-size: 14px;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: #333;
            color: #fff;
        }

        /* Main Container */
        .main-container {
            display: flex;
            margin-top: 56px;
            height: calc(100vh - 56px);
            position: relative;
        }

        /* Sidebar Responsive */
        sidebar {
            position: fixed;
            top: 56px;
            left: -240px; /* Tersembunyi secara default di HP */
            width: 240px;
            height: calc(100vh - 56px);
            background-color: #0f0f0f;
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 999;
            transition: left 0.3s ease-in-out;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        sidebar.open {
            left: 0; /* Muncul saat kelas open aktif */
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #f1f1f1;
            text-decoration: none;
            margin-bottom: 4px;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: #272727;
        }

        .sidebar-item i {
            font-size: 18px;
            width: 24px;
        }

        hr {
            border: none;
            border-top: 1px solid #3f3f3f;
            margin: 12px 0;
        }

        /* Content Area */
        .content {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            align-content: start;
            width: 100%;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            gap: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #555;
            flex-shrink: 0;
        }

        .video-details h3 {
            font-size: 14px;
            font-weight: 500;
            color: #f1f1f1;
            line-height: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-details p {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Player Overlay / Mini Screen Mode */
        .player-overlay {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            background: #212121;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .player-overlay.miniscreen {
            max-width: 280px;
            height: 160px;
            bottom: 12px;
            right: 12px;
            border-radius: 8px;
        }

        .player-overlay.miniscreen .playlist-section,
        .player-overlay.miniscreen .player-meta,
        .player-overlay.miniscreen .player-header span {
            display: none;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
            padding: 8px 12px;
        }

        .player-header span {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .player-controls-btns {
            display: flex;
            gap: 12px;
        }

        .player-controls-btns button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
        }

        .player-meta {
            padding: 10px 12px;
            background: #1f1f1f;
        }

        .player-meta h4 {
            font-size: 13px;
            margin-bottom: 2px;
        }

        /* Playlist Section inside Player */
        .playlist-section {
            max-height: 130px;
            overflow-y: auto;
            background: #181818;
            border-top: 1px solid #333;
            padding: 8px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .playlist-item:hover {
            background: #333;
        }

        .playlist-item.active {
            background: #3f3f3f;
            color: #3ea6ff;
        }

        .playlist-item img {
            width: 50px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Media Queries untuk Layar Sangat Kecil / HP */
        @media (max-width: 768px) {
            .search-container {
                max-width: none;
                margin: 0 8px;
            }
            .header-right .fa-video, 
            .header-right .fa-bell {
                display: none; /* Sembunyikan ikon tidak penting di HP kecil */
            }
            .content {
                grid-template-columns: 1fr; /* 1 kolom penuh di layar HP */
                padding: 8px;
            }
            .player-overlay {
                width: 100%;
                max-width: 100%;
                border-radius: 0;
            }
            .player-overlay.miniscreen {
                max-width: 240px;
                height: 135px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <!-- Tombol Hamburger -->
            <button class="menu-toggle" id="menu-toggle-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="#" class="logo"><i class="fab fa-youtube"></i>YouTube</a>
        </div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Telusuri...">
            </div>
            <button class="search-btn" id="search-submit"><i class="fas fa-search"></i></button>
        </div>
        <div class="header-right">
            <i class="fas fa-video" style="cursor:pointer; font-size: 16px;"></i>
            <i class="fas fa-bell" style="cursor:pointer; font-size: 16px;"></i>
            <div class="channel-avatar" style="width: 28px; height: 28px;"></div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar dengan Animasi Buka/Tutup -->
        <sidebar id="sidebar">
            <a href="#" class="sidebar-item active"><i class="fas fa-home"></i>Beranda</a>
            <a href="#" class="sidebar-item"><i class="fas fa-bolt"></i>Shorts</a>
            <a href="#" class="sidebar-item"><i class="fas fa-subscriptions"></i>Subscription</a>
            <hr>
            <a href="#" class="sidebar-item"><i class="fas fa-history"></i>Histori</a>
            <a href="#" class="sidebar-item"><i class="fas fa-play-circle"></i>Video Anda</a>
            <a href="#" class="sidebar-item"><i class="fas fa-clock"></i>Tonton Nanti</a>
            <a href="#" class="sidebar-item"><i class="fas fa-list"></i>Daftar Putar</a>
        </sidebar>

        <!-- Video Grid Content -->
        <div class="content" id="video-grid">
            <!-- Video cards dimuat dinamis via JS -->
        </div>
    </div>

    <!-- Floating / Mini Screen / Full Player Overlay -->
    <div class="player-overlay" id="player-overlay">
        <div class="player-header">
            <span id="current-video-title">Memutar Video...</span>
            <div class="player-controls-btns">
                <button id="btn-mini" title="Mini Screen"><i class="fas fa-window-minimize"></i></button>
                <button id="btn-fullscreen" title="Full Screen"><i class="fas fa-expand"></i></button>
                <button id="btn-close" title="Tutup"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="player-wrapper">
            <div id="youtube-player"></div>
        </div>
        <div class="player-meta">
            <h4 id="meta-title">Judul Video</h4>
            <p id="meta-channel" style="color: #aaa; font-size: 11px;">Nama Channel</p>
        </div>
        <!-- Playlist antrean video -->
        <div class="playlist-section" id="playlist-container">
            <h5 style="font-size: 11px; margin-bottom: 4px; color: #aaa;">Daftar Putar Antrean</h5>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        const YT_API_KEY = "AIzaSyDgu2BS4TTqCPNJV6GgkkHr7k9IzLIActo";
        
        const defaultVideos = [
            { id: "jfKfPfyJRdk", title: "Lofi Hip Hop Radio - Beats to Relax/Study to", channel: "Lofi Girl", thumb: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg" },
            { id: "5qap5aO4i9A", title: "Lofi Hip Hop Radio - Live 24/7 Music", channel: "Lofi Girl", thumb: "https://i.ytimg.com/vi/5qap5aO4i9A/hqdefault.jpg" },
            { id: "dQw4w9WgXcQ", title: "Rick Astley - Never Gonna Give You Up", channel: "Rick Astley", thumb: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
            { id: "9bZkp7q19f0", title: "PSY - GANGNAM STYLE M/V", channel: "officialpsy", thumb: "https://i.ytimg.com/vi/9bZkp7q19f0/hqdefault.jpg" },
            { id: "kJQP7kiw5Fk", title: "Luis Fonsi - Despacito ft. Daddy Yankee", channel: "Luis Fonsi", thumb: "https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
            { id: "JGwWNGJdvx8", title: "Ed Sheeran - Shape of You", channel: "Ed Sheeran", thumb: "https://i.ytimg.com/vi/JGwWNGJdvx8/hqdefault.jpg" }
        ];

        let playlist = [...defaultVideos];
        let currentIndex = 0;
        let player;
        let isMiniScreen = false;

        // Toggle Sidebar & Animasi Hamburger Menu (Berubah jadi X)
        const menuToggleBtn = document.getElementById('menu-toggle-btn');
        const sidebar = document.getElementById('sidebar');

        menuToggleBtn.addEventListener('click', () => {
            menuToggleBtn.classList.toggle('active');
            sidebar.classList.toggle('open');
        });

        // Tutup sidebar otomatis jika mengklik area konten di HP
        document.getElementById('video-grid').addEventListener('click', () => {
            if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                menuToggleBtn.classList.remove('active');
            }
        });

        // Muat YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {}

        // Render Grid Video
        function renderVideos(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = "";
            videos.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${vid.thumb}" alt="${vid.title}">
                    </div>
                    <div class="video-info">
                        <div class="channel-avatar"></div>
                        <div class="video-details">
                            <h3>${vid.title}</h3>
                            <p>${vid.channel}</p>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    playVideo(vid, index);
                });
                grid.appendChild(card);
            });
        }

        function playVideo(videoObj, index = 0) {
            currentIndex = index;
            const overlay = document.getElementById('player-overlay');
            overlay.style.display = 'flex';
            
            document.getElementById('current-video-title').innerText = videoObj.title;
            document.getElementById('meta-title').innerText = videoObj.title;
            document.getElementById('meta-channel').innerText = videoObj.channel;

            renderPlaylistUI();

            if (!player) {
                player = new YT.Player('youtube-player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoObj.id,
                    playerVars: { 'autoplay': 1, 'controls': 1 },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            } else {
                player.loadVideoById(videoObj.id);
            }
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                currentIndex++;
                if (currentIndex < playlist.length) {
                    playVideo(playlist[currentIndex], currentIndex);
                } else {
                    currentIndex = 0;
                    playVideo(playlist[currentIndex], currentIndex);
                }
            }
        }

        function renderPlaylistUI() {
            const container = document.getElementById('playlist-container');
            container.innerHTML = `<h5 style="font-size: 11px; margin-bottom: 4px; color: #aaa;">Daftar Putar Antrean</h5>`;
            
            playlist.forEach((item, idx) => {
                const pItem = document.createElement('div');
                pItem.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                pItem.innerHTML = `
                    <img src="${item.thumb}" alt="">
                    <div style="overflow: hidden;">
                        <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">${item.title}</div>
                        <div style="color: #aaa; font-size: 10px;">${item.channel}</div>
                    </div>
                `;
                pItem.addEventListener('click', () => {
                    playVideo(item, idx);
                });
                container.appendChild(pItem);
            });
        }

        // Kontrol Mini Screen, Fullscreen, & Close
        document.getElementById('btn-mini').addEventListener('click', () => {
            const overlay = document.getElementById('player-overlay');
            isMiniScreen = !isMiniScreen;
            if (isMiniScreen) {
                overlay.classList.add('miniscreen');
                document.getElementById('btn-mini').innerHTML = '<i class="fas fa-window-maximize"></i>';
            } else {
                overlay.classList.remove('miniscreen');
                document.getElementById('btn-mini').innerHTML = '<i class="fas fa-window-minimize"></i>';
            }
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            const playerWrapper = document.querySelector('.player-wrapper');
            if (playerWrapper.requestFullscreen) {
                playerWrapper.requestFullscreen();
            } else if (playerWrapper.webkitRequestFullscreen) {
                playerWrapper.webkitRequestFullscreen();
            }
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            const overlay = document.getElementById('player-overlay');
            overlay.style.display = 'none';
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            isMiniScreen = false;
            overlay.classList.remove('miniscreen');
            document.getElementById('btn-mini').innerHTML = '<i class="fas fa-window-minimize"></i>';
        });

        // Pencarian YouTube API
        async function searchYouTube(query) {
            if (!query.trim()) return;
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YT_API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items) {
                    const searchResults = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle,
                        thumb: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    }));
                    playlist = searchResults;
                    renderVideos(searchResults);
                } else if (data.error) {
                    alert("Pemberitahuan API: " + data.error.message);
                }
            } catch (error) {
                console.error("Gagal melakukan pencarian:", error);
            }
        }

        document.getElementById('search-submit').addEventListener('click', () => {
            searchYouTube(document.getElementById('search-input').value);
        });

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchYouTube(e.target.value);
            }
        });

        renderVideos(defaultVideos);
    </script>
</body>
</html>

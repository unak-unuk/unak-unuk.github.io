<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Web Player - Modern UI</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            overflow-x: hidden;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Tombol Hamburger */
        .menu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 1100;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #f1f1f1;
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            color: #fff;
            text-decoration: none;
        }

        .logo i {
            color: #ff0000;
            font-size: 22px;
        }

        /* Search Box */
        .search-container {
            display: flex;
            flex-grow: 1;
            max-width: 600px;
            margin: 0 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            width: 100%;
            height: 40px;
        }

        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .search-btn {
            background: #222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            width: 50px;
            height: 40px;
            cursor: pointer;
            color: #aaa;
            font-size: 14px;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: #333;
            color: #fff;
        }

        /* Main Container */
        .main-container {
            display: flex;
            margin-top: 56px;
            height: calc(100vh - 56px);
            position: relative;
        }

        /* Sidebar Responsive */
        sidebar {
            position: fixed;
            top: 56px;
            left: -240px;
            width: 240px;
            height: calc(100vh - 56px);
            background-color: #0f0f0f;
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 999;
            transition: left 0.3s ease-in-out;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        sidebar.open {
            left: 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #f1f1f1;
            text-decoration: none;
            margin-bottom: 4px;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: #272727;
        }

        .sidebar-item i {
            font-size: 18px;
            width: 24px;
        }

        hr {
            border: none;
            border-top: 1px solid #3f3f3f;
            margin: 12px 0;
        }

        .sidebar-section-title {
            font-size: 12px;
            color: #aaa;
            padding: 6px 12px;
            font-weight: 500;
        }

        /* Content Area */
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 500;
        }

        .btn-action {
            background: #3ea6ff;
            color: #0f0f0f;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-action:hover {
            background: #65b8ff;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .video-details h3 {
            font-size: 14px;
            font-weight: 500;
            color: #f1f1f1;
            line-height: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-details p {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        .btn-options {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 50%;
        }
        .btn-options:hover {
            color: #fff;
            background: #272727;
        }

        /* Playlist Cards List View */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .playlist-card {
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .playlist-card-cover {
            width: 100%;
            aspect-ratio: 16/9;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 32px;
        }

        .playlist-card-info {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .playlist-card-info h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .playlist-card-info p {
            font-size: 12px;
            color: #aaa;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .modal-box {
            background: #212121;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .modal-box h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .modal-box input {
            width: 100%;
            padding: 10px 12px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-cancel {
            background: transparent;
            color: #aaa;
        }
        .btn-cancel:hover { color: #fff; }
        .btn-submit { background: #3ea6ff; color: #0f0f0f; }
        .btn-submit:hover { background: #65b8ff; }

        /* Player Overlay */
        .player-overlay {
            position: fixed;
            top: 56px;
            right: 0;
            width: 100%;
            max-width: 450px;
            background: #212121;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow: visible;
            transition: all 0.3s ease;
        }

        .player-overlay.miniscreen {
            max-width: 280px;
            height: 160px;
            top: auto;
            bottom: 12px;
            right: 12px;
            border-radius: 8px;
            overflow: hidden;
        }

        .player-overlay.miniscreen .playlist-section,
        .player-overlay.miniscreen .player-meta,
        .player-overlay.miniscreen .player-header span {
            display: none;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
            padding: 8px 12px;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
        }

        .player-header span {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .player-controls-btns {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .player-controls-btns button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
        }

        .player-meta {
            padding: 10px 12px;
            background: #1f1f1f;
        }

        .player-meta h4 {
            font-size: 13px;
            margin-bottom: 2px;
        }

        /* Panel Daftar Putar Antrean (Membentang Penuh Sampai Bawah Layar) */
        .playlist-section {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 0;
            max-height: 0;
            overflow-y: auto;
            background: #181818;
            border-top: 1px solid #333;
            padding: 0 12px;
            visibility: hidden;
            transition: height 0.3s ease-in-out, max-height 0.3s ease-in-out, padding 0.3s ease, visibility 0.3s;
            z-index: 2500;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        .playlist-section.show {
            height: calc(100vh - 56px - 100% - 12px);
            max-height: calc(100vh - 56px - 100% - 12px);
            padding: 12px;
            visibility: visible;
        }

        /* Kustom Scrollbar */
        .playlist-section::-webkit-scrollbar {
            width: 6px;
        }
        .playlist-section::-webkit-scrollbar-track {
            background: #181818;
        }
        .playlist-section::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .playlist-section::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            background: #212121;
        }

        .playlist-item:hover {
            background: #333;
        }

        .playlist-item.active {
            background: #3f3f3f;
            color: #3ea6ff;
        }

        .playlist-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .playlist-item img {
            width: 60px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .search-container {
                max-width: none;
                margin: 0 8px;
            }
            .header-right .fa-video, 
            .header-right .fa-bell {
                display: none;
            }
            .video-grid {
                grid-template-columns: 1fr;
            }
            .player-overlay {
                width: 100%;
                max-width: 100%;
                border-radius: 0;
                top: 56px;
            }
            .player-overlay.miniscreen {
                max-width: 240px;
                height: 135px;
                bottom: 12px;
                top: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="#" class="logo" id="logo-home"><i class="fab fa-youtube"></i>YouTube</a>
        </div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Telusuri...">
            </div>
            <button class="search-btn" id="search-submit"><i class="fas fa-search"></i></button>
        </div>
        <div class="header-right">
            <i class="fas fa-video" style="cursor:pointer; font-size: 16px;"></i>
            <i class="fas fa-bell" style="cursor:pointer; font-size: 16px;"></i>
            <div class="channel-avatar" style="width: 28px; height: 28px; background:#555; border-radius:50%;"></div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <sidebar id="sidebar">
            <a href="#" class="sidebar-item active" id="nav-home"><i class="fas fa-home"></i>Beranda</a>
            <a href="#" class="sidebar-item"><i class="fas fa-bolt"></i>Shorts</a>
            <a href="#" class="sidebar-item"><i class="fas fa-subscriptions"></i>Subscription</a>
            <hr>
            <a href="#" class="sidebar-item"><i class="fas fa-history"></i>Histori</a>
            <a href="#" class="sidebar-item"><i class="fas fa-play-circle"></i>Video Anda</a>
            <a href="#" class="sidebar-item"><i class="fas fa-clock"></i>Tonton Nanti</a>
            <hr>
            <div class="sidebar-section-title">DAFTAR PUTAR</div>
            <a href="#" class="sidebar-item" id="nav-playlists"><i class="fas fa-list"></i>Semua Playlist</a>
            <a href="#" class="sidebar-item" id="nav-create-playlist"><i class="fas fa-plus-circle"></i>Buat Playlist Baru</a>
        </sidebar>

        <!-- Dynamic Content Area -->
        <div class="content" id="main-content-area">
            <div class="section-header">
                <h2>Video Rekomendasi</h2>
            </div>
            <div class="video-grid" id="video-grid"></div>
        </div>
    </div>

    <!-- Modal Buat Playlist Baru -->
    <div class="modal-overlay" id="modal-create-playlist">
        <div class="modal-box">
            <h3>Buat Playlist Baru</h3>
            <input type="text" id="playlist-name-input" placeholder="Nama Playlist...">
            <div class="modal-buttons">
                <button class="btn-submit" id="modal-create-btn">Buat</button>
                <button class="btn-cancel" id="modal-cancel-btn">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Pilih Playlist saat video ingin ditambahkan -->
    <div class="modal-overlay" id="modal-add-to-playlist">
        <div class="modal-box">
            <h3>Simpan video ke...</h3>
            <div id="modal-playlist-options" style="max-height: 150px; overflow-y: auto; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;"></div>
            
            <div class="modal-buttons">
                <button class="btn-submit" id="modal-confirm-save-btn"><i class="fas fa-plus"></i> Simpan</button>
                <button class="btn-cancel" id="modal-add-cancel-btn">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Player Overlay -->
    <div class="player-overlay" id="player-overlay">
        <div class="player-header">
            <span id="current-video-title">Memutar Video...</span>
            <div class="player-controls-btns">
                <button id="btn-toggle-queue" title="Daftar Putar Antrean"><i class="fas fa-list-ul"></i></button>
                <button id="btn-mini" title="Mini Screen"><i class="fas fa-window-minimize"></i></button>
                <button id="btn-fullscreen" title="Full Screen"><i class="fas fa-expand"></i></button>
                <button id="btn-close" title="Tutup"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="player-wrapper">
            <div id="youtube-player"></div>
        </div>
        <div class="player-meta">
            <h4 id="meta-title">Judul Video</h4>
            <p id="meta-channel" style="color: #aaa; font-size: 11px;">Nama Channel</p>
        </div>
        <!-- Panel Daftar Putar Antrean Membentang Sampai Bawah -->
        <div class="playlist-section" id="playlist-container">
            <h5 style="font-size: 12px; margin-bottom: 8px; color: #aaa; font-weight: 500;">Daftar Putar Antrean</h5>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        const YT_API_KEY = "AIzaSyDgu2BS4TTqCPNJV6GgkkHr7k9IzLIActo";
        
        const defaultVideos = [
            { id: "jfKfPfyJRdk", title: "Lofi Hip Hop Radio - Beats to Relax/Study to", channel: "Lofi Girl", thumb: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg" },
            { id: "5qap5aO4i9A", title: "Lofi Hip Hop Radio - Live 24/7 Music", channel: "Lofi Girl", thumb: "https://i.ytimg.com/vi/5qap5aO4i9A/hqdefault.jpg" },
            { id: "dQw4w9WgXcQ", title: "Rick Astley - Never Gonna Give You Up", channel: "Rick Astley", thumb: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
            { id: "9bZkp7q19f0", title: "PSY - GANGNAM STYLE M/V", channel: "officialpsy", thumb: "https://i.ytimg.com/vi/9bZkp7q19f0/hqdefault.jpg" },
            { id: "kJQP7kiw5Fk", title: "Luis Fonsi - Despacito ft. Daddy Yankee", channel: "Luis Fonsi", thumb: "https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
            { id: "JGwWNGJdvx8", title: "Ed Sheeran - Shape of You", channel: "Ed Sheeran", thumb: "https://i.ytimg.com/vi/JGwWNGJdvx8/hqdefault.jpg" }
        ];

        let currentVideosList = [...defaultVideos];
        let queuePlaylist = [...defaultVideos];
        let currentIndex = 0;
        let player;
        let isMiniScreen = false;
        let adBlockInterval = null;

        let customPlaylists = JSON.parse(localStorage.getItem('yt_custom_playlists')) || [
            { id: 'fav1', name: 'Musik Favorit', videos: [defaultVideos[0], defaultVideos[2]] }
        ];

        function savePlaylists() {
            localStorage.setItem('yt_custom_playlists', JSON.stringify(customPlaylists));
        }

        let activeVideoToSave = null;
        let selectedPlaylistIndex = null;

        const menuToggleBtn = document.getElementById('menu-toggle-btn');
        const sidebar = document.getElementById('sidebar');

        menuToggleBtn.addEventListener('click', () => {
            menuToggleBtn.classList.toggle('active');
            sidebar.classList.toggle('open');
        });

        function closeSidebarMobile() {
            if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                menuToggleBtn.classList.remove('active');
            }
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {}

        function renderHomeView(videos = defaultVideos, title = "Video Rekomendasi") {
            const mainArea = document.getElementById('main-content-area');
            mainArea.innerHTML = `
                <div class="section-header">
                    <h2>${title}</h2>
                </div>
                <div class="video-grid" id="video-grid"></div>
            `;
            const grid = document.getElementById('video-grid');
            
            videos.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${vid.thumb}" alt="${vid.title}">
                    </div>
                    <div class="video-info">
                        <div style="display:flex; gap:10px; overflow:hidden;">
                            <div style="width:32px; height:32px; background:#555; border-radius:50%; flex-shrink:0;"></div>
                            <div class="video-details">
                                <h3>${vid.title}</h3>
                                <p>${vid.channel}</p>
                            </div>
                        </div>
                        <button class="btn-options" title="Opsi" onclick="event.stopPropagation(); openAddToPlaylistModal('${vid.id}')">
                            <i class="fas fa-ellipsis-vertical"></i>
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => {
                    queuePlaylist = [...videos];
                    playVideo(vid, index);
                });
                grid.appendChild(card);
            });
        }

        document.getElementById('logo-home').addEventListener('click', (e) => {
            e.preventDefault();
            renderHomeView(defaultVideos, "Video Rekomendasi");
            closeSidebarMobile();
        });

        document.getElementById('nav-home').addEventListener('click', (e) => {
            e.preventDefault();
            renderHomeView(defaultVideos, "Video Rekomendasi");
            closeSidebarMobile();
        });

        document.getElementById('nav-playlists').addEventListener('click', (e) => {
            e.preventDefault();
            renderPlaylistsView();
            closeSidebarMobile();
        });

        document.getElementById('nav-create-playlist').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('modal-create-playlist').style.display = 'flex';
            document.getElementById('playlist-name-input').value = '';
            closeSidebarMobile();
        });

        function renderPlaylistsView() {
            const mainArea = document.getElementById('main-content-area');
            mainArea.innerHTML = `
                <div class="section-header">
                    <h2>Daftar Playlist Anda</h2>
                    <button class="btn-action" id="btn-create-from-view"><i class="fas fa-plus"></i> Buat Playlist</button>
                </div>
                <div class="playlist-grid" id="playlist-grid-container"></div>
            `;

            document.getElementById('btn-create-from-view').addEventListener('click', () => {
                document.getElementById('modal-create-playlist').style.display = 'flex';
                document.getElementById('playlist-name-input').value = '';
            });

            const gridContainer = document.getElementById('playlist-grid-container');
            if (customPlaylists.length === 0) {
                gridContainer.innerHTML = `<p style="color: #aaa; font-size: 14px;">Belum ada playlist yang dibuat.</p>`;
                return;
            }

            customPlaylists.forEach((pl, idx) => {
                const card = document.createElement('div');
                card.className = 'playlist-card';
                card.innerHTML = `
                    <div class="playlist-card-cover">
                        <i class="fas fa-list-ul"></i>
                    </div>
                    <div class="playlist-card-info">
                        <div>
                            <h4>${pl.name}</h4>
                            <p>${pl.videos.length} video</p>
                        </div>
                        <button class="btn-options" title="Hapus Playlist" onclick="event.stopPropagation(); deletePlaylist(${idx})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => {
                    renderSinglePlaylistDetail(pl);
                });
                gridContainer.appendChild(card);
            });
        }

        function renderSinglePlaylistDetail(playlistObj) {
            const mainArea = document.getElementById('main-content-area');
            mainArea.innerHTML = `
                <div class="section-header">
                    <h2>Playlist: ${playlistObj.name}</h2>
                    <button class="btn-action" style="background:#222; color:#fff; border:1px solid #444;" id="back-to-playlists">Kembali</button>
                </div>
                <div class="video-grid" id="playlist-detail-grid"></div>
            `;

            document.getElementById('back-to-playlists').addEventListener('click', () => {
                renderPlaylistsView();
            });

            const grid = document.getElementById('playlist-detail-grid');
            if (playlistObj.videos.length === 0) {
                grid.innerHTML = `<p style="color: #aaa; font-size: 14px;">Playlist ini masih kosong. Tambahkan video dari beranda!</p>`;
                return;
            }

            playlistObj.videos.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${vid.thumb}" alt="${vid.title}">
                    </div>
                    <div class="video-info">
                        <div style="display:flex; gap:10px; overflow:hidden;">
                            <div style="width:32px; height:32px; background:#555; border-radius:50%; flex-shrink:0;"></div>
                            <div class="video-details">
                                <h3>${vid.title}</h3>
                                <p>${vid.channel}</p>
                            </div>
                        </div>
                        <button class="btn-options" title="Hapus dari Playlist" onclick="event.stopPropagation(); removeVideoFromPlaylist('${playlistObj.name}', '${vid.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => {
                    queuePlaylist = [...playlistObj.videos];
                    playVideo(vid, index);
                });
                grid.appendChild(card);
            });
        }

        document.getElementById('modal-create-btn').addEventListener('click', () => {
            const name = document.getElementById('playlist-name-input').value.trim();
            if (!name) {
                Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Nama playlist tidak boleh kosong!', background: '#212121', color: '#fff' });
                return;
            }
            
            customPlaylists.push({ id: 'pl_' + Date.now(), name: name, videos: [] });
            savePlaylists();
            document.getElementById('modal-create-playlist').style.display = 'none';
            renderPlaylistsView();
            
            Swal.fire({ icon: 'success', title: 'Berhasil', text: `Playlist "${name}" berhasil dibuat!`, timer: 1500, showConfirmButton: false, background: '#212121', color: '#fff' });
        });

        document.getElementById('modal-cancel-btn').addEventListener('click', () => {
            document.getElementById('modal-create-playlist').style.display = 'none';
        });

        window.openAddToPlaylistModal = function(videoId) {
            let foundVid = defaultVideos.find(v => v.id === videoId) || currentVideosList.find(v => v.id === videoId);
            if (!foundVid) {
                for(let pl of customPlaylists) {
                    let v = pl.videos.find(item => item.id === videoId);
                    if(v) { foundVid = v; break; }
                }
            }
            activeVideoToSave = foundVid;
            selectedPlaylistIndex = null;

            const container = document.getElementById('modal-playlist-options');
            container.innerHTML = "";

            if (customPlaylists.length === 0) {
                container.innerHTML = `<p style="font-size:13px; color:#aaa;">Belum ada playlist. Buat terlebih dahulu melalui menu sidebar.</p>`;
            } else {
                customPlaylists.forEach((pl, idx) => {
                    const isAlreadyIn = pl.videos.some(v => v.id === videoId);
                    const item = document.createElement('div');
                    item.className = 'playlist-option-row';
                    item.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#181818; padding:10px 12px; border-radius:6px; cursor:pointer; border: 1px solid transparent;";
                    item.innerHTML = `
                        <span style="font-size:13px;">${pl.name} (${pl.videos.length})</span>
                        <span style="font-size:12px; color: ${isAlreadyIn ? '#3ea6ff' : '#aaa'};">${isAlreadyIn ? 'Sudah Ada' : 'Pilih'}</span>
                    `;
                    
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.playlist-option-row').forEach(el => el.style.borderColor = 'transparent');
                        item.style.borderColor = '#3ea6ff';
                        selectedPlaylistIndex = idx;
                    });
                    
                    container.appendChild(item);
                });
            }

            document.getElementById('modal-add-to-playlist').style.display = 'flex';
        };

        document.getElementById('modal-confirm-save-btn').addEventListener('click', () => {
            if (selectedPlaylistIndex === null) {
                Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Silakan pilih salah satu playlist terlebih dahulu!', background: '#212121', color: '#fff' });
                return;
            }

            const targetPl = customPlaylists[selectedPlaylistIndex];
            const isAlreadyIn = targetPl.videos.some(v => v.id === activeVideoToSave.id);

            if (!isAlreadyIn && activeVideoToSave) {
                targetPl.videos.push(activeVideoToSave);
                savePlaylists();
                document.getElementById('modal-add-to-playlist').style.display = 'none';
                
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: `Video ditambahkan ke "${targetPl.name}"`,
                    timer: 1500,
                    showConfirmButton: false,
                    background: '#212121',
                    color: '#fff'
                });
            } else {
                Swal.fire({ icon: 'info', title: 'Informasi', text: 'Video sudah ada di dalam playlist ini.', background: '#212121', color: '#fff' });
            }
        });

        document.getElementById('modal-add-cancel-btn').addEventListener('click', () => {
            document.getElementById('modal-add-to-playlist').style.display = 'none';
        });

        window.deletePlaylist = function(index) {
            Swal.fire({
                title: 'Hapus Playlist?',
                text: `Yakin ingin menghapus playlist "${customPlaylists[index].name}"?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3ea6ff',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Ya, Hapus',
                cancelButtonText: 'Batal',
                background: '#212121',
                color: '#fff'
            }).then((result) => {
                if (result.isConfirmed) {
                    customPlaylists.splice(index, 1);
                    savePlaylists();
                    renderPlaylistsView();
                    Swal.fire({ icon: 'success', title: 'Terhapus!', text: 'Playlist berhasil dihapus.', timer: 1500, showConfirmButton: false, background: '#212121', color: '#fff' });
                }
            });
        };

        window.removeVideoFromPlaylist = function(playlistName, videoId) {
            const pl = customPlaylists.find(p => p.name === playlistName);
            if (pl) {
                pl.videos = pl.videos.filter(v => v.id !== videoId);
                savePlaylists();
                renderSinglePlaylistDetail(pl);
                Swal.fire({ icon: 'success', title: 'Dihapus', text: 'Video dikeluarkan dari playlist.', timer: 1200, showConfirmButton: false, background: '#212121', color: '#fff' });
            }
        };

        function playVideo(videoObj, index = 0) {
            currentIndex = index;
            const overlay = document.getElementById('player-overlay');
            overlay.style.display = 'flex';
            
            document.getElementById('current-video-title').innerText = videoObj.title;
            document.getElementById('meta-title').innerText = videoObj.title;
            document.getElementById('meta-channel').innerText = videoObj.channel;

            renderPlaylistQueueUI();

            if (!player) {
                player = new YT.Player('youtube-player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoObj.id,
                    playerVars: { 
                        'autoplay': 1, 
                        'controls': 1,
                        'modestbranding': 1,
                        'rel': 0
                    },
                    events: { 
                        'onStateChange': onPlayerStateChange,
                        'onReady': onPlayerReady
                    }
                });
            } else {
                player.loadVideoById(videoObj.id);
            }

            startAdBlockerMonitor();
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function startAdBlockerMonitor() {
            if (adBlockInterval) clearInterval(adBlockInterval);
            
            adBlockInterval = setInterval(() => {
                if (player && typeof player.getVideoData === 'function') {
                    try {
                        const duration = player.getDuration();
                        const currentTime = player.getCurrentTime();
                        const iframe = document.getElementById('youtube-player');
                        if (iframe) {
                            try {
                                const innerDoc = iframe.contentDocument || iframe.contentWindow.document;
                                const adElements = innerDoc.querySelectorAll('.ad-showing, .video-ads, .ytp-ad-module');
                                if (adElements.length > 0) {
                                    if (typeof player.seekTo === 'function' && duration > currentTime) {
                                        player.seekTo(duration - 0.1, true);
                                    }
                                }
                            } catch (e) {}
                        }
                    } catch (err) {}
                }
            }, 1000);
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                if (adBlockInterval) clearInterval(adBlockInterval);
                currentIndex++;
                if (currentIndex < queuePlaylist.length) {
                    playVideo(queuePlaylist[currentIndex], currentIndex);
                } else {
                    currentIndex = 0;
                    playVideo(queuePlaylist[currentIndex], currentIndex);
                }
            }
        }

        function renderPlaylistQueueUI() {
            const container = document.getElementById('playlist-container');
            container.innerHTML = `<h5 style="font-size: 12px; margin-bottom: 8px; color: #aaa; font-weight: 500;">Daftar Putar Antrean</h5>`;
            
            queuePlaylist.forEach((item, idx) => {
                const pItem = document.createElement('div');
                pItem.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                pItem.innerHTML = `
                    <div class="playlist-item-left">
                        <img src="${item.thumb}" alt="">
                        <div style="overflow: hidden;">
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">${item.title}</div>
                            <div style="color: #aaa; font-size: 10px;">${item.channel}</div>
                        </div>
                    </div>
                `;
                pItem.addEventListener('click', () => {
                    playVideo(item, idx);
                    document.getElementById('playlist-container').classList.remove('show');
                });
                container.appendChild(pItem);
            });
        }

        document.getElementById('btn-toggle-queue').addEventListener('click', () => {
            const queueContainer = document.getElementById('playlist-container');
            queueContainer.classList.toggle('show');
        });

        document.getElementById('btn-mini').addEventListener('click', () => {
            const overlay = document.getElementById('player-overlay');
            isMiniScreen = !isMiniScreen;
            if (isMiniScreen) {
                overlay.classList.add('miniscreen');
                document.getElementById('btn-mini').innerHTML = '<i class="fas fa-window-maximize"></i>';
                document.getElementById('playlist-container').classList.remove('show');
            } else {
                overlay.classList.remove('miniscreen');
                document.getElementById('btn-mini').innerHTML = '<i class="fas fa-window-minimize"></i>';
            }
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            const playerWrapper = document.querySelector('.player-wrapper');
            if (playerWrapper.requestFullscreen) {
                playerWrapper.requestFullscreen();
            } else if (playerWrapper.webkitRequestFullscreen) {
                playerWrapper.webkitRequestFullscreen();
            }
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            const overlay = document.getElementById('player-overlay');
            overlay.style.display = 'none';
            document.getElementById('playlist-container').classList.remove('show');
            if (adBlockInterval) clearInterval(adBlockInterval);
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            isMiniScreen = false;
            overlay.classList.remove('miniscreen');
            document.getElementById('btn-mini').innerHTML = '<i class="fas fa-window-minimize"></i>';
        });

        async function searchYouTube(query) {
            if (!query.trim()) return;
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YT_API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items) {
                    const searchResults = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle,
                        thumb: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    }));
                    currentVideosList = searchResults;
                    renderHomeView(searchResults, `Hasil Pencarian: "${query}"`);
                } else if (data.error) {
                    Swal.fire({ icon: 'error', title: 'Error API', text: data.error.message, background: '#212121', color: '#fff' });
                }
            } catch (error) {
                console.error("Gagal melakukan pencarian:", error);
            }
        }

        document.getElementById('search-submit').addEventListener('click', () => {
            searchYouTube(document.getElementById('search-input').value);
        });

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchYouTube(e.target.value);
            }
        });

        renderHomeView(defaultVideos, "Video Rekomendasi");
    </script>
</body>
</html>

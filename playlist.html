<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Public App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .playlist-item { cursor: pointer; transition: background 0.2s; }
        .playlist-item:hover, .playlist-item.active { background-color: #e9ecef; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-brands fa-youtube text-danger"></i> YT Playlist App</a>
            <div class="d-flex">
                <button id="nav-btn-home" class="btn btn-outline-light btn-sm me-2" onclick="showPage('user')"><i class="fa-solid fa-house"></i> Beranda</button>
                <button id="nav-btn-admin" class="btn btn-outline-warning btn-sm" onclick="checkAdminAccess()"><i class="fa-solid fa-lock"></i> Admin</button>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container my-4">
        
        <!-- ================= HALAMAN PENGGUNA ================= -->
        <div id="page-user" class="page-section">
            <div class="row">
                <!-- Status Bar -->
                <div class="col-12 mb-3">
                    <div id="status-alert" class="alert d-flex align-items-center justify-content-between py-2" role="alert">
                        <div>
                            <i class="fa-solid fa-circle-info me-2"></i> Status Sistem: <strong id="status-text">Memuat...</strong>
                        </div>
                        <small id="last-updated" class="text-muted"></small>
                    </div>
                </div>

                <!-- Main Player & Playlist View -->
                <div class="col-lg-8 mb-4">
                    <div class="card shadow-sm">
                        <div class="card-body p-0">
                            <div class="video-container bg-dark" id="player-box">
                                <div class="d-flex justify-content-center align-items-center h-100 text-white text-center p-4" id="placeholder-video">
                                    <p class="mb-0">Silakan pilih video dari daftar playlist di samping atau di bawah.</p>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-white">
                            <h5 id="current-video-title" class="mb-1 text-truncate">Pilih Video</h5>
                            <p id="current-playlist-name" class="text-muted small mb-0"></p>
                        </div>
                    </div>
                </div>

                <!-- Daftar Playlist Sidebar -->
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <i class="fa-solid fa-list me-1"></i> Daftar Playlist
                        </div>
                        <div class="card-body p-0" style="max-height: 500px; overflow-y: auto;" id="public-playlist-container">
                            <div class="text-center p-4 text-muted">Memuat data...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= HALAMAN LOGIN ADMIN ================= -->
        <div id="page-login" class="page-section" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-user-lock"></i> Login Admin</h5>
                        </div>
                        <div class="card-body">
                            <form id="login-form" onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" id="admin-user" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="admin-pass" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-dark w-100">Masuk</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= HALAMAN PANEL ADMIN ================= -->
        <div id="page-admin" class="page-section" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Panel Pengelola Admin</h2>
                <button class="btn btn-danger btn-sm" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
            </div>

            <!-- Pengaturan Status -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-secondary text-white">
                    <i class="fa-solid fa-sliders"></i> Pengaturan Status Sistem
                </div>
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Ubah Status Sistem (Online / Offline):</label>
                            <select id="admin-status-select" class="form-select">
                                <option value="ONLINE">ONLINE (Dapat diakses pengguna)</option>
                                <option value="OFFLINE">OFFLINE (Sedang pemeliharaan / Tutup)</option>
                            </select>
                        </div>
                        <div class="col-md-4 mt-3 mt-md-0">
                            <button class="btn btn-success w-100 mt-4" onclick="saveStatusSystem()"><i class="fa-solid fa-floppy-disk"></i> Simpan Status</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kelola Playlist -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <span><i class="fa-solid fa-folder-plus"></i> Tambah Playlist / Kategori Baru</span>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <input type="text" id="new-playlist-title" class="form-control" placeholder="Nama Kategori / Playlist (Cth: Musik Rohani, Kajian, dll)">
                        <button class="btn btn-primary" onclick="addPlaylist()"><i class="fa-solid fa-plus"></i> Tambah</button>
                    </div>
                </div>
            </div>

            <!-- List Kategori & Video Admin -->
            <div id="admin-playlist-editor">
                <!-- Diisi via Javascript -->
            </div>
        </div>

    </div>

    <!-- Bootstrap & Script Pendukung -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Konfigurasi Database & API
        const BIN_ID = "6afb5d03ac6210605a8cdcd4";
        const MASTER_KEY = "$2a$10$Ii1ep5GX66sB9lery6p2suxzNGrSMg2iwncn5Z2y/HT5WjaHRrf1q";
        const YT_API_KEY = "AIzaSyCrogZjjtH00X5MsDYs79ZCnB9ljI2bdRk";
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let appData = {
            status: "ONLINE",
            playlists: []
        };

        // Saat halaman pertama kali dimuat
        document.addEventListener("DOMContentLoaded", () => {
            fetchData();
            // Refresh otomatis data tiap 10 detik agar sinkron
            setInterval(fetchData, 10000);
        });

        // Navigasi Halaman
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.style.display = 'none');
            if(pageId === 'user') {
                document.getElementById('page-user').style.display = 'block';
            } else if(pageId === 'login') {
                document.getElementById('page-login').style.display = 'block';
            } else if(pageId === 'admin') {
                document.getElementById('page-admin').style.display = 'block';
                renderAdminEditor();
            }
        }

        // Ambil Data dari JSONBin
        async function fetchData() {
            try {
                let response = await fetch(JSONBIN_URL + "/latest", {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                if(response.ok) {
                    let result = await response.json();
                    appData = result.record;
                    updateUI();
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        // Simpan Data ke JSONBin
        async function saveData() {
            try {
                let response = await fetch(JSONBIN_URL, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": MASTER_KEY
                    },
                    body: JSON.stringify(appData)
                });
                if(response.ok) {
                    alert("Perubahan berhasil disimpan!");
                    fetchData();
                } else {
                    alert("Gagal menyimpan data ke server.");
                }
            } catch (error) {
                console.error("Gagal menyimpan:", error);
            }
        }

        // Perbarui Tampilan Sisi Pengguna
        function updateUI() {
            // Update Status Banner
            const alertBox = document.getElementById('status-alert');
            const statusText = document.getElementById('status-text');
            
            if(appData.status === "ONLINE") {
                alertBox.className = "alert alert-success d-flex align-items-center justify-content-between py-2";
                statusText.innerText = "ONLINE - Layanan aktif dan dapat disaksikan.";
            } else {
                alertBox.className = "alert alert-danger d-flex align-items-center justify-content-between py-2";
                statusText.innerText = "OFFLINE - Layanan sedang ditutup / istirahat.";
            }

            // Render Public Playlist List
            let container = document.getElementById('public-playlist-container');
            if(!appData.playlists || appData.playlists.length === 0) {
                container.innerHTML = `<div class="p-3 text-center text-muted">Belum ada playlist tersedia.</div>`;
                return;
            }

            let html = "";
            appData.playlists.forEach((pl, pIndex) => {
                html += `<div class="p-2 bg-light border-bottom fw-bold text-secondary"><i class="fa-solid folder me-1"></i> ${pl.title}</div>`;
                if(!pl.videos || pl.videos.length === 0) {
                    html += `<div class="p-2 text-muted small ps-3">Tidak ada video di playlist ini</div>`;
                } else {
                    pl.videos.forEach((vid, vIndex) => {
                        html += `
                            <div class="playlist-item p-2 border-bottom ps-3 d-flex align-items-center" onclick="playVideo('${vid.videoId}', '${vid.title}', '${pl.title}')">
                                <img src="https://img.youtube.com/vi/${vid.videoId}/default.jpg" class="me-2 rounded" width="60" height="45" style="object-fit:cover;">
                                <div class="text-truncate small">
                                    <div class="fw-semibold text-dark text-truncate">${vid.title}</div>
                                </div>
                            </div>
                        `;
                    });
                }
            });
            container.innerHTML = html;
        }

        // Fungsi Memutar Video YouTube
        function playVideo(videoId, title, playlistTitle) {
            const playerBox = document.getElementById('player-box');
            playerBox.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="YouTube video player" frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
            `;
            document.getElementById('current-video-title').innerText = title;
            document.getElementById('current-playlist-name').innerText = "Playlist: " + playlistTitle;
        }

        // Fungsi Keamanan Admin
        function checkAdminAccess() {
            let session = sessionStorage.getItem('isAdminLoggedIn');
            if(session === 'true') {
                showPage('admin');
            } else {
                showPage('login');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('admin-user').value;
            let p = document.getElementById('admin-pass').value;

            if(u === 'haryono' && p === 'hry33576') {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                showPage('admin');
                document.getElementById('login-form').reset();
            } else {
                alert('Username atau Password salah!');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('isAdminLoggedIn');
            showPage('user');
        }

        // Render Halaman Editor Admin
        function renderAdminEditor() {
            document.getElementById('admin-status-select').value = appData.status || "ONLINE";
            let container = document.getElementById('admin-playlist-editor');
            
            if(!appData.playlists || appData.playlists.length === 0) {
                container.innerHTML = `<div class="alert alert-info">Belum ada playlist. Buat playlist baru di atas.</div>`;
                return;
            }

            let html = "";
            appData.playlists.forEach((pl, pIndex) => {
                html += `
                    <div class="card shadow-sm mb-3">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center">
                            <strong><i class="fa-solid fa-list-ul"></i> ${pl.title}</strong>
                            <button class="btn btn-outline-danger btn-sm" onclick="deletePlaylist(${pIndex})"><i class="fa-solid fa-trash"></i> Hapus Playlist</button>
                        </div>
                        <div class="card-body">
                            <!-- Form Tambah Video -->
                            <div class="input-group mb-3">
                                <input type="text" id="vid-url-${pIndex}" class="form-control form-control-sm" placeholder="Link YouTube atau Video ID (Cth: dQw4w9WgXcQ)">
                                <input type="text" id="vid-title-${pIndex}" class="form-control form-control-sm" placeholder="Judul Video">
                                <button class="btn btn-success btn-sm" onclick="addVideo(${pIndex})"><i class="fa-solid fa-plus"></i> Tambah Video</button>
                            </div>
                            <!-- Tabel Video -->
                            <div class="table-responsive">
                                <table class="table table-sm table-bordered mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Thumbnail</th>
                                            <th>Judul Video</th>
                                            <th>ID Video</th>
                                            <th class="text-center" style="width: 80px;">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                `;
                
                if(!pl.videos || pl.videos.length === 0) {
                    html += `<tr><td colspan="4" class="text-center text-muted">Belum ada video dalam playlist ini.</td></tr>`;
                } else {
                    pl.videos.forEach((vid, vIndex) => {
                        html += `
                            <tr>
                                <td class="align-middle text-center"><img src="https://img.youtube.com/vi/${vid.videoId}/default.jpg" width="50" height="35" class="rounded"></td>
                                <td class="align-middle">${vid.title}</td>
                                <td class="align-middle text-muted small">${vid.videoId}</td>
                                <td class="align-middle text-center">
                                    <button class="btn btn-danger btn-sm" onclick="deleteVideo(${pIndex}, ${vIndex})"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                }

                html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Fungsi Aksi Admin (Simpan Status, Tambah/Hapus Playlist & Video)
        function saveStatusSystem() {
            appData.status = document.getElementById('admin-status-select').value;
            saveData();
        }

        function addPlaylist() {
            let titleInput = document.getElementById('new-playlist-title');
            let title = titleInput.value.trim();
            if(!title) return alert('Nama playlist tidak boleh kosong!');

            if(!appData.playlists) appData.playlists = [];
            appData.playlists.push({ title: title, videos: [] });
            titleInput.value = '';
            saveData();
        }

        function deletePlaylist(pIndex) {
            if(confirm("Yakin ingin menghapus playlist ini beserta semua videonya?")) {
                appData.playlists.splice(pIndex, 1);
                saveData();
            }
        }

        // Ekstraksi Video ID dari URL YouTube atau Input Langsung
        function extractVideoId(urlOrId) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (urlOrId.length === 11 ? urlOrId : null);
        }

        function addVideo(pIndex) {
            let urlInput = document.getElementById(`vid-url-${pIndex}`).value.trim();
            let titleInput = document.getElementById(`vid-title-${pIndex}`).value.trim();

            let videoId = extractVideoId(urlInput);
            if(!videoId) return alert('Link YouTube atau ID Video tidak valid!');
            if(!titleInput) return alert('Judul video wajib diisi!');

            if(!appData.playlists[pIndex].videos) appData.playlists[pIndex].videos = [];
            appData.playlists[pIndex].videos.push({ videoId: videoId, title: titleInput });
            saveData();
        }

        function deleteVideo(pIndex, vIndex) {
            if(confirm("Hapus video ini dari playlist?")) {
                appData.playlists[pIndex].videos.splice(vIndex, 1);
                saveData();
            }
        }
    </script>
</body>
</html>

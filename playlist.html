<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Player - YouTube App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; overflow: hidden; border-radius: 0.75rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #yt-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .placeholder-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1e1e1e; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .back-btn { position: absolute; top: 20px; left: 20px; z-index: 10; }
    </style>
</head>
<body>

    <a href="index.html" class="btn btn-outline-light btn-sm back-btn shadow-sm"><i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar</a>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Wrapper video yang akan di-fullscreen-kan -->
                <div class="video-container mb-3" id="player-wrapper">
                    <div id="yt-player"></div>
                    <div class="placeholder-box text-center p-4" id="placeholder-video">
                        <i class="fa-brands fa-youtube text-danger fa-4x mb-3"></i>
                        <h4>Pemutar Video Standby</h4>
                        <p class="text-muted small">Menunggu Admin memilih atau memutar lagu...</p>
                    </div>
                </div>
                <div class="bg-dark p-3 rounded shadow-sm border border-secondary d-flex justify-content-between align-items-center">
                    <div class="text-truncate pe-2">
                        <h5 id="current-video-title" class="mb-1 text-truncate fw-bold">Belum ada video diputar</h5>
                        <p id="current-playlist-name" class="text-muted small mb-0">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const BIN_ID = "6afb5d03ac6210605a8cdcd4";
        const MASTER_KEY = "$2a$10$Ii1ep5GX66sB9lery6p2suxzNGrSMg2iwncn5Z2y/HT5WjaHRrf1q";
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let appData = null;
        let player = null;
        let pendingVideoId = null;
        let lastSyncedVideoId = null;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
                events: { 'onReady': () => { if(pendingVideoId) { player.loadVideoById(pendingVideoId); pendingVideoId = null; } } }
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchData();
            setInterval(fetchData, 4000);
            initAutoLandscapeFullscreen();
        });

        // Fitur Deteksi Fullscreen & Otomatis Ubah ke Landscape di HP
        function initAutoLandscapeFullscreen() {
            const wrapper = document.getElementById('player-wrapper');

            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('MSFullscreenChange', handleFullscreenChange);

            function handleFullscreenChange() {
                let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

                if (isFullscreen) {
                    // Coba kunci orientasi ke landscape jika perangkat mendukung (khusus Mobile/Android)
                    if (screen.orientation && typeof screen.orientation.lock === 'function') {
                        screen.orientation.lock('landscape').catch(err => {
                            console.log("Orientasi landscape tidak didukung otomatis atau perlu interaksi tambahan:", err);
                        });
                    }
                } else {
                    // Kembalikan orientasi layar seperti semula saat keluar dari fullscreen
                    if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                        try { screen.orientation.unlock(); } catch (e) {}
                    }
                }
            }
        }

        async function fetchData() {
            try {
                let res = await fetch(JSONBIN_URL + "/latest", { headers: { "X-Master-Key": MASTER_KEY } });
                if(res.ok) {
                    let json = await res.json();
                    appData = json.record;
                    syncPlayer();
                }
            } catch(e) { console.error(e); }
        }

        function syncPlayer() {
            if (appData.activePlaylist !== null && appData.activeVideo !== null) {
                let pl = appData.playlists[appData.activePlaylist];
                if (pl && pl.videos && pl.videos[appData.activeVideo]) {
                    let vid = pl.videos[appData.activeVideo];
                    if (lastSyncedVideoId !== vid.videoId) {
                        lastSyncedVideoId = vid.videoId;
                        document.getElementById('placeholder-video').style.display = 'none';
                        if (player && typeof player.loadVideoById === 'function') {
                            player.loadVideoById(vid.videoId);
                        } else {
                            pendingVideoId = vid.videoId;
                        }
                        document.getElementById('current-video-title').innerText = vid.title;
                        document.getElementById('current-playlist-name').innerText = "Kategori: " + pl.title;
                    }
                } else {
                    lastSyncedVideoId = null;
                    document.getElementById('placeholder-video').style.display = 'flex';
                    document.getElementById('current-video-title').innerText = "Belum ada video diputar";
                    document.getElementById('current-playlist-name').innerText = "-";
                }
            }
        }
    </script>
</body>
</html>

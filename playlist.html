<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player - Fullscreen Landscape</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            user-select: none;
        }

        /* Default Fullscreen Landscape Stage */
        .landscape-stage {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            background: #000000;
            z-index: 10;
            overflow: hidden;
        }

        /* Rotasi paksa ke landscape jika perangkat sedang portrait */
        @media screen and (orientation: portrait) {
            .landscape-stage {
                width: 100vh;
                height: 100vw;
                transform: translate(-50%, -50%) rotate(90deg);
            }
        }

        #yt-player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 2;
        }

        .placeholder-box {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #0b0d12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 3;
        }

        /* Mode Offline Total */
        .system-offline-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 22, 0.97);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 24px;
        }
    </style>
</head>
<body>

    <!-- Overlay Peringatan Sistem Offline -->
    <div id="offline-overlay" class="system-offline-overlay">
        <div style="max-width: 420px;">
            <i class="fa-solid fa-triangle-exclamation text-warning fa-4x mb-3"></i>
            <h2 class="fw-bold">Sistem Sedang Offline</h2>
            <p class="text-light mb-0">Layanan penayangan video saat ini sedang dinonaktifkan oleh Admin.</p>
        </div>
    </div>

    <!-- Stage Pemutar Fullscreen Landscape -->
    <div id="landscape-stage" class="landscape-stage" onclick="tryEnterDeviceLandscapeFullscreen()">
        <div id="yt-player"></div>
        <div id="placeholder-video" class="placeholder-box">
            <i class="fa-brands fa-youtube text-danger fa-3x mb-3"></i>
            <h5 class="fw-bold mb-1">Menunggu Antrean Video</h5>
            <p class="text-white-50 small mb-0">Video akan otomatis tampil dan diputar saat antrean tersedia.</p>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const BIN_ID = "6afb5d03ac6210605a8cdcd4";
        const MASTER_KEY = "$2a$10$Ii1ep5GX66sB9lery6p2suxzNGrSMg2iwncn5Z2y/HT5WjaHRrf1q";
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let appData = {
            status: "ONLINE",
            activePlaylist: null,
            activeVideo: null,
            playlists: []
        };

        let player = null;
        let isPlayerReady = false;
        let pendingVideoId = null;
        let currentLoadedVideoId = null;
        let isProcessingEnded = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady() {
            isPlayerReady = true;
            if (pendingVideoId) {
                loadAndPlayVideoId(pendingVideoId);
                pendingVideoId = null;
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && !isProcessingEnded) {
                handleVideoEndedAndPlayNext();
            }
        }

        function loadAndPlayVideoId(videoId) {
            currentLoadedVideoId = videoId;
            let placeholder = document.getElementById('placeholder-video');
            if (placeholder) placeholder.style.display = 'none';

            if (isPlayerReady && player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(videoId);
            } else {
                pendingVideoId = videoId;
            }
        }

        function showEmptyQueuePlaceholder() {
            currentLoadedVideoId = null;
            pendingVideoId = null;
            let placeholder = document.getElementById('placeholder-video');
            if (placeholder) placeholder.style.display = 'flex';
            if (isPlayerReady && player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
        }

        async function tryEnterDeviceLandscapeFullscreen() {
            try {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (e) {}

            try {
                if (screen.orientation && typeof screen.orientation.lock === 'function') {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }

        document.addEventListener("DOMContentLoaded", () => {
            tryEnterDeviceLandscapeFullscreen();
            fetchData();
            setInterval(fetchData, 4000);
        });

        async function fetchData() {
            if (isProcessingEnded) return;
            try {
                let response = await fetch(JSONBIN_URL + "/latest", {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                if (response.ok) {
                    let result = await response.json();
                    appData = result.record || {
                        status: "ONLINE",
                        activePlaylist: null,
                        activeVideo: null,
                        playlists: []
                    };
                    checkSystemStatus();
                    syncPlayerWithQueue();
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        function checkSystemStatus() {
            let overlay = document.getElementById('offline-overlay');
            let isOffline = (appData.status === "OFFLINE");
            overlay.style.display = isOffline ? 'flex' : 'none';

            if (isOffline && isPlayerReady && player && typeof player.pauseVideo === 'function') {
                player.pauseVideo();
            }
        }

        async function saveData() {
            try {
                let response = await fetch(JSONBIN_URL, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": MASTER_KEY
                    },
                    body: JSON.stringify(appData)
                });
                return response.ok;
            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                return false;
            }
        }

        function ensureValidActiveQueue() {
            if (!Array.isArray(appData.playlists) || appData.playlists.length === 0) {
                appData.activePlaylist = null;
                appData.activeVideo = null;
                return null;
            }

            let pIdx = appData.activePlaylist;
            let vIdx = appData.activeVideo;

            if (
                typeof pIdx === "number" &&
                appData.playlists[pIdx] &&
                Array.isArray(appData.playlists[pIdx].videos) &&
                appData.playlists[pIdx].videos.length > 0
            ) {
                if (typeof vIdx !== "number" || vIdx < 0 || vIdx >= appData.playlists[pIdx].videos.length) {
                    appData.activeVideo = 0;
                    vIdx = 0;
                }
                return appData.playlists[pIdx].videos[vIdx];
            }

            // Cari kategori pertama yang memiliki video
            for (let p = 0; p < appData.playlists.length; p++) {
                let pl = appData.playlists[p];
                if (pl && Array.isArray(pl.videos) && pl.videos.length > 0) {
                    appData.activePlaylist = p;
                    appData.activeVideo = 0;
                    return pl.videos[0];
                }
            }

            appData.activePlaylist = null;
            appData.activeVideo = null;
            return null;
        }

        function syncPlayerWithQueue() {
            if (appData.status === "OFFLINE") return;

            let activeItem = ensureValidActiveQueue();
            if (!activeItem || !activeItem.videoId) {
                showEmptyQueuePlaceholder();
                return;
            }

            if (currentLoadedVideoId !== activeItem.videoId) {
                loadAndPlayVideoId(activeItem.videoId);
            }
        }

        async function handleVideoEndedAndPlayNext() {
            isProcessingEnded = true;
            try {
                // Ambil data terbaru dari JSONBin agar sinkron dengan antrean terkini
                let latestRes = await fetch(JSONBIN_URL + "/latest", {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                if (latestRes.ok) {
                    let latestJson = await latestRes.json();
                    if (latestJson.record) {
                        appData = latestJson.record;
                    }
                }

                let pIdx = appData.activePlaylist;
                let vIdx = appData.activeVideo;

                if (
                    typeof pIdx === "number" &&
                    appData.playlists &&
                    appData.playlists[pIdx] &&
                    Array.isArray(appData.playlists[pIdx].videos) &&
                    appData.playlists[pIdx].videos.length > 0
                ) {
                    let removeIndex = (typeof vIdx === "number" && vIdx >= 0 && vIdx < appData.playlists[pIdx].videos.length)
                        ? vIdx
                        : 0;

                    // Hapus video yang baru selesai diputar dari database
                    appData.playlists[pIdx].videos.splice(removeIndex, 1);

                    // Tentukan video berikutnya
                    if (appData.playlists[pIdx].videos.length > 0) {
                        appData.activePlaylist = pIdx;
                        appData.activeVideo = removeIndex < appData.playlists[pIdx].videos.length ? removeIndex : 0;
                    } else {
                        // Cari kategori berikutnya yang masih punya video
                        let nextFound = false;
                        for (let nextP = 0; nextP < appData.playlists.length; nextP++) {
                            let candidatePl = appData.playlists[nextP];
                            if (candidatePl && Array.isArray(candidatePl.videos) && candidatePl.videos.length > 0) {
                                appData.activePlaylist = nextP;
                                appData.activeVideo = 0;
                                nextFound = true;
                                break;
                            }
                        }
                        if (!nextFound) {
                            appData.activePlaylist = null;
                            appData.activeVideo = null;
                        }
                    }
                } else {
                    ensureValidActiveQueue();
                }

                await saveData();

                let nextVideo = ensureValidActiveQueue();
                if (nextVideo && nextVideo.videoId) {
                    currentLoadedVideoId = null;
                    loadAndPlayVideoId(nextVideo.videoId);
                } else {
                    showEmptyQueuePlaceholder();
                }
            } catch (error) {
                console.error("Gagal memproses video selesai:", error);
            } finally {
                isProcessingEnded = false;
            }
        }
    </script>
</body>
</html>

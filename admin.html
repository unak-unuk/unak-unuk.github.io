<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Data Unit RM0</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #e2e8f0;
            --ok-color: #16a34a;
            --ng-color: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }
        .nav-link { display: inline-block; margin-bottom: 15px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        /* Card Utama RM0 */
        .rm0-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 10px;
        }
        .rm0-card h2 { font-size: 1.25rem; color: var(--primary); }

        /* Instruksi Geser */
        .swipe-hint {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Area List Unit dengan Sistem Scroll */
        .unit-list-wrapper {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            max-height: 400px; /* Batas tinggi agar bisa di-scroll */
            overflow-y: auto;   /* Sistem scroll vertikal aktif */
        }

        .unit-item { 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            margin-bottom: 10px; 
            background: #fafaf9; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .unit-item:hover { background: #f1f5f9; }
        .unit-header { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary); margin-bottom: 4px; font-size: 0.95rem; }
        
        .badge-ok { background: #dcfce7; color: var(--ok-color); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-ng { background: #fee2e2; color: var(--ng-color); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }

        /* Pop-up Input / Edit (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; }
        .modal-content h3 { margin-bottom: 15px; color: var(--primary); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        
        .row-inputs { display: flex; gap: 10px; }
        .row-inputs input { flex: 1; }

        input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { resize: vertical; height: 70px; }

        /* Pilihan OK / NG Button Group */
        .status-group { display: flex; gap: 10px; }
        .status-btn { flex: 1; padding: 10px; border: 2px solid var(--border-color); background: #f8fafc; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
        .status-btn.ok-active { background: #dcfce7; border-color: var(--ok-color); color: var(--ok-color); }
        .status-btn.ng-active { background: #fee2e2; border-color: var(--ng-color); color: var(--ng-color); }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #e2e8f0; color: #475569; }
        .btn-save { background: var(--accent); color: white; }

        /* Pop-up Aksi Edit / Hapus */
        .action-modal-content { background: white; padding: 20px; border-radius: 10px; width: 280px; text-align: center; position: relative; }
        .btn-action { width: 100%; padding: 10px; margin-bottom: 8px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-edit-action { background: #f59e0b; color: white; }
        .btn-del-action { background: var(--ng-color); color: white; }
        .close-x { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b; }
        
        .empty-state { text-align: center; color: #64748b; padding: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Panel Admin</h1>
        <p style="color: #64748b; font-size: 0.9rem;">Kelola data unit harian</p>
    </header>

    <a href="customer.html" target="_blank" class="nav-link">🔗 Buka Halaman Pelanggan (customer.html) &rarr;</a>

    <!-- Card RM0 -->
    <div class="rm0-card" id="rm0-card-box">
        <h2>Data unit RM0</h2>
    </div>
    <div class="swipe-hint">👈 Geser card ke kiri untuk input unit baru</div>

    <!-- Daftar Semua Unit dengan Scroll -->
    <div class="unit-list-wrapper" id="unit-list-container">
        <div class="empty-state">Memuat data unit...</div>
    </div>
</div>

<!-- Modal Pop-up Input / Edit Unit -->
<div class="modal" id="input-modal">
    <div class="modal-content">
        <h3 id="modal-title">Input Unit Baru</h3>
        <form id="unit-form" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="unit-id">
            <div class="form-group">
                <label>Suffix & Nomor Body</label>
                <div class="row-inputs">
                    <input type="text" id="suffix" placeholder="Suffix" required>
                    <!-- type="tel" dengan pattern numerik untuk keyboard angka di HP -->
                    <input type="tel" id="bodyNo" placeholder="No. Body" inputmode="numeric" pattern="[0-9]*" required>
                </div>
            </div>
            <div class="form-group">
                <label for="problem">Problem</label>
                <textarea id="problem" placeholder="Deskripsikan problem..." required></textarea>
            </div>
            <div class="form-group">
                <label>Status (OK / NG)</label>
                <input type="hidden" id="status" value="OK">
                <div class="status-group">
                    <div class="status-btn ok-active" id="btn-ok" onclick="setStatus('OK')">OK</div>
                    <div class="status-btn" id="btn-ng" onclick="setStatus('NG')">NG</div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-modal btn-cancel" onclick="closeInputModal()">Batal</button>
                <button type="submit" class="btn-modal btn-save" id="save-btn">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Pop-up Aksi Edit / Hapus (dengan tanda X) -->
<div class="modal" id="action-modal">
    <div class="action-modal-content">
        <button class="close-x" onclick="closeActionModal()">&times;</button>
        <h3 style="margin-bottom: 15px; color: var(--primary);">Aksi Data Unit</h3>
        <p id="action-unit-info" style="font-size: 0.9rem; color: #64748b; margin-bottom: 15px;"></p>
        <button class="btn-action btn-edit-action" onclick="triggerEdit()">Ubah Data (Edit)</button>
        <button class="btn-action btn-del-action" onclick="triggerDelete()">Hapus Data</button>
    </div>
</div>

<script>
    const BIN_ID = '6ac6d3d3ffd5d16053578248'; 
    const API_KEY = '$2a$10$J3w8xef7DXv5BbTRPXhode9aDKdUT4dXjw3cJH1X/WiPxjNafFEP.';

    let allUnits = [];
    let activeUnitId = null;

    // Gestur Geser ke Kiri (Swipe Left) pada Card RM0
    const cardBox = document.getElementById('rm0-card-box');
    let touchStartX = 0;

    cardBox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    cardBox.addEventListener('touchend', e => {
        let touchEndX = e.changedTouches[0].clientX;
        if (touchStartX - touchEndX > 50) {
            openInputModal();
        }
    });
    cardBox.addEventListener('mousedown', e => { touchStartX = e.clientX; });
    cardBox.addEventListener('mouseup', e => {
        if (touchStartX - e.clientX > 50) {
            openInputModal();
        }
    });

    async function loadData() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let result = await res.json();
            allUnits = result.record || [];
            renderUnitList();
        } catch (err) { console.error(err); }
    }

    async function saveData() {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
            body: JSON.stringify(allUnits)
        });
    }

    function setStatus(val) {
        document.getElementById('status').value = val;
        if(val === 'OK') {
            document.getElementById('btn-ok').className = 'status-btn ok-active';
            document.getElementById('btn-ng').className = 'status-btn';
        } else {
            document.getElementById('btn-ok').className = 'status-btn';
            document.getElementById('btn-ng').className = 'status-btn ng-active';
        }
    }

    function openInputModal(isEdit = false) {
        if(!isEdit) {
            document.getElementById('unit-form').reset();
            document.getElementById('unit-id').value = '';
            document.getElementById('modal-title').innerText = 'Input Unit Baru';
            setStatus('OK');
        }
        document.getElementById('input-modal').style.display = 'flex';
    }

    function closeInputModal() { document.getElementById('input-modal').style.display = 'none'; }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('unit-id').value;
        const suffix = document.getElementById('suffix').value.toUpperCase().trim();
        const bodyNo = document.getElementById('bodyNo').value.trim();
        const problem = document.getElementById('problem').value.trim();
        const status = document.getElementById('status').value;

        if(id) {
            allUnits = allUnits.map(u => u.id === id ? {...u, suffix, bodyNo, problem, status} : u);
        } else {
            allUnits.push({ id: Date.now().toString(), suffix, bodyNo, problem, status });
        }

        document.getElementById('save-btn').innerText = 'Menyimpan...';
        await saveData();
        document.getElementById('save-btn').innerText = 'Simpan';
        
        closeInputModal();
        renderUnitList();
        alert('Data berhasil disimpan!');
    }

    function renderUnitList() {
        const container = document.getElementById('unit-list-container');
        container.innerHTML = '';
        if(allUnits.length === 0) {
            container.innerHTML = `<div class="empty-state">Belum ada data unit. Geser card di atas ke kiri untuk menambah unit.</div>`;
            return;
        }

        allUnits.forEach((u) => {
            const badgeClass = u.status === 'OK' ? 'badge-ok' : 'badge-ng';
            container.innerHTML += `
                <div class="unit-item" onclick="openActionModal('${u.id}', '${u.suffix}', '${u.bodyNo}')">
                    <div class="unit-header">
                        <span>${u.suffix}-${u.bodyNo}</span>
                        <span class="${badgeClass}">${u.status}</span>
                    </div>
                    <p style="font-size:0.9rem; color:#475569;">Problem: ${u.problem}</p>
                </div>
            `;
        });
    }

    function openActionModal(id, suffix, bodyNo) {
        activeUnitId = id;
        document.getElementById('action-unit-info').innerText = `Unit: ${suffix}-${bodyNo}`;
        document.getElementById('action-modal').style.display = 'flex';
    }

    function closeActionModal() { document.getElementById('action-modal').style.display = 'none'; }

    function triggerEdit() {
        closeActionModal();
        const u = allUnits.find(item => item.id === activeUnitId);
        if(u) {
            document.getElementById('unit-id').value = u.id;
            document.getElementById('suffix').value = u.suffix;
            document.getElementById('bodyNo').value = u.bodyNo;
            document.getElementById('problem').value = u.problem;
            setStatus(u.status);
            document.getElementById('modal-title').innerText = 'Edit Data Unit';
            document.getElementById('input-modal').style.display = 'flex';
        }
    }

    async function triggerDelete() {
        if(confirm('Yakin ingin menghapus data unit ini?')) {
            allUnits = allUnits.filter(item => item.id !== activeUnitId);
            await saveData();
            closeActionModal();
            renderUnitList();
        }
    }

    loadData();
</script>
</body>
</html>

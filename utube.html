<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - MusicStream Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar ala YouTube */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #272727;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f3f;
        }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen flex flex-col font-sans">

    <!-- Top Navbar (Header YouTube) -->
    <header class="bg-[#0f0f0f] border-b border-[#272727] px-4 py-2.5 flex justify-between items-center sticky top-0 z-50">
        <!-- Logo & Brand -->
        <div class="flex items-center space-x-4">
            <button class="text-gray-400 hover:text-white p-2 rounded-full hover:bg-[#272727] transition">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-1 cursor-pointer" onclick="searchMusic('Top Music')">
                <i class="fa-brands fa-youtube text-red-600 text-3xl"></i>
                <span class="font-bold text-xl tracking-tighter">YouTube <span class="text-xs bg-red-600 text-white px-1.5 py-0.5 rounded font-normal align-top">Music</span></span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="flex items-center flex-1 max-w-xl mx-4">
            <div class="flex w-full bg-[#121212] border border-[#303030] rounded-l-full px-4 py-2 focus-within:border-blue-500">
                <input type="text" id="searchInput" placeholder="Telusuri..." 
                    class="w-full bg-transparent text-white focus:outline-none text-sm">
            </div>
            <button id="searchBtn" class="bg-[#222222] border border-l-0 border-[#303030] px-6 py-2 rounded-r-full hover:bg-[#272727] text-gray-300 transition">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <!-- User / Status Badge -->
        <div class="flex items-center space-x-3">
            <div class="hidden sm:flex items-center text-xs bg-[#272727] text-green-400 px-3 py-1.5 rounded-full font-medium border border-green-500/20">
                <i class="fa-solid fa-shield-halved mr-1.5"></i> Ad-Free Active
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Kiri -->
        <aside class="w-64 bg-[#0f0f0f] p-3 hidden md:flex flex-col space-y-1 border-r border-[#272727] shrink-0">
            <a href="#" onclick="searchMusic('Top Music')" class="flex items-center space-x-6 px-3 py-2.5 rounded-xl bg-[#272727] text-white font-medium text-sm">
                <i class="fa-solid fa-house text-lg w-6"></i> <span>Beranda</span>
            </a>
            <a href="#" onclick="searchMusic('Trending Music')" class="flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-[#272727]/60 text-gray-300 hover:text-white transition text-sm">
                <i class="fa-solid fa-bolt text-lg w-6"></i> <span>Eksplorasi</span>
            </a>
            <a href="#" onclick="searchMusic('Live Music Mix')" class="flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-[#272727]/60 text-gray-300 hover:text-white transition text-sm">
                <i class="fa-solid fa-music text-lg w-6"></i> <span>Musik</span>
            </a>
            <hr class="border-[#272727] my-2">
            <div class="px-3 py-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">Koleksi Anda</div>
            <a href="#" onclick="searchMusic('Favorite Playlist')" class="flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-[#272727]/60 text-gray-300 hover:text-white transition text-sm">
                <i class="fa-solid fa-list-ul text-lg w-6"></i> <span>Antrean Aktif</span>
            </a>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col lg:flex-row gap-6">
            
            <!-- Kolom Kiri: Player & Info Video -->
            <div class="flex-1 flex flex-col gap-4 max-w-4xl mx-auto w-full">
                <!-- Video Player -->
                <div class="bg-black rounded-2xl overflow-hidden shadow-2xl relative aspect-video border border-[#272727]">
                    <div id="player" class="w-full h-full"></div>
                    <div id="playerOverlay" class="absolute inset-0 bg-transparent pointer-events-none"></div>
                </div>

                <!-- Judul & Info Lagu -->
                <div class="flex flex-col gap-2">
                    <h1 id="currentTitle" class="font-bold text-xl text-white">Pilih lagu untuk mulai memutar</h1>
                    <div class="flex justify-between items-center bg-[#1f1f1f] p-4 rounded-xl border border-[#272727]">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-bold text-white shadow" id="channelAvatar">
                                <i class="fa-solid fa-microphone-lines"></i>
                            </div>
                            <div>
                                <p id="currentChannel" class="font-semibold text-sm text-gray-200">-</p>
                                <span class="text-xs text-gray-400">Channel Resmi</span>
                            </div>
                        </div>
                        <!-- Tombol Kontrol Media -->
                        <div class="flex items-center gap-2">
                            <button id="prevBtn" class="bg-[#272727] hover:bg-[#3f3f3f] px-4 py-2.5 rounded-full transition text-sm flex items-center gap-2">
                                <i class="fa-solid fa-backward-step"></i> <span class="hidden sm:inline">Sebelumnya</span>
                            </button>
                            <button id="nextBtn" class="bg-white text-black hover:bg-gray-200 px-5 py-2.5 rounded-full transition font-semibold text-sm flex items-center gap-2 shadow">
                                <i class="fa-solid fa-forward-step"></i> <span>Selanjutnya</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: Daftar Antrean / Rekomendasi (Gaya YouTube Sidebar) -->
            <div class="w-full lg:w-96 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-base text-gray-200 flex items-center gap-2">
                        <i class="fa-solid fa-list text-red-500"></i> Antrean Musik Berikutnya
                    </h3>
                    <span class="text-xs text-gray-400" id="queueCount">0 lagu</span>
                </div>
                
                <div id="playlistContainer" class="space-y-2 overflow-y-auto max-h-[600px] pr-1">
                    <!-- Daftar lagu akan dimuat secara dinamis di sini -->
                </div>
            </div>

        </main>
    </div>

    <!-- YouTube IFrame API Script & Logic -->
    <script>
        let player;
        let playlist = [];
        let currentIndex = 0;
        const apiKey = "AIzaSyCrogZjjtH00X5MsDYs79ZCnB9ljI2bdRk"; // Kunci API Anda

        // Load YouTube IFrame Player API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'playsinline': 1,
                    'controls': 1,
                    'rel': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log("Player siap.");
            searchMusic("Top Pop Hits Indonesia");
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                playNext();
            }
        }

        async function searchMusic(query) {
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${apiKey}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items) {
                    playlist = data.items;
                    document.getElementById('queueCount').innerText = `${playlist.length} lagu`;
                    renderPlaylist();
                    if (playlist.length > 0) {
                        playSong(0);
                    }
                }
            } catch (error) {
                console.error("Gagal mengambil data YouTube:", error);
            }
        }

        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const video = playlist[currentIndex];
            const videoId = video.id.videoId;
            
            player.loadVideoById(videoId);
            document.getElementById('currentTitle').innerText = video.snippet.title;
            document.getElementById('currentChannel').innerText = video.snippet.channelTitle;
            renderPlaylist(); // Update status aktif di antrean
        }

        function playNext() {
            currentIndex = (currentIndex + 1) % playlist.length;
            playSong(currentIndex);
        }

        function playPrev() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playSong(currentIndex);
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            playlist.forEach((item, index) => {
                const isActive = index === currentIndex;
                const div = document.createElement('div');
                div.className = `p-2 rounded-xl flex items-center gap-3 cursor-pointer transition group ${isActive ? 'bg-[#272727] border border-red-500/30' : 'hover:bg-[#1f1f1f]'}`;
                div.innerHTML = `
                    <div class="relative w-28 aspect-video shrink-0 rounded-lg overflow-hidden bg-gray-800">
                        <img src="${item.snippet.thumbnails.medium.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        ${isActive ? '<div class="absolute inset-0 bg-red-600/30 flex items-center justify-center"><i class="fa-solid fa-volume-high text-white text-xs"></i></div>' : ''}
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <p class="font-medium text-xs sm:text-sm line-clamp-2 ${isActive ? 'text-red-400 font-semibold' : 'text-gray-200'}">${item.snippet.title}</p>
                        <p class="text-xs text-gray-400 mt-1 truncate">${item.snippet.channelTitle}</p>
                    </div>
                `;
                div.onclick = () => playSong(index);
                container.appendChild(div);
            });
        }

        // Event Listeners
        document.getElementById('searchBtn').onclick = () => {
            const query = document.getElementById('searchInput').value;
            if (query) searchMusic(query);
        };

        document.getElementById('searchInput').onkeypress = (e) => {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        };

        document.getElementById('nextBtn').onclick = playNext;
        document.getElementById('prevBtn').onclick = playPrev;
    </script>
</body>
</html>

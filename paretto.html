<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatat Problem Pareto - Shift System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5-Qrcode untuk Scan Barcode via Kamera -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        .modal-enter { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-20">

    <!-- ================= HEADER / STICKY CARD ================= -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md px-4 pt-4 pb-3 border-b border-slate-800 shadow-xl">
        <div class="max-w-md mx-auto">
            <!-- Card Keren Penuh Warna -->
            <div class="bg-gradient-to-r from-violet-600 via-indigo-600 to-cyan-500 rounded-3xl p-5 shadow-lg relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                
                <div class="flex justify-between items-start relative z-10">
                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider bg-black/20 text-white/90 px-2.5 py-1 rounded-full">Pareto Quality System</span>
                        <h1 class="text-xl font-bold text-white mt-2">Pencatat Problem Pareto</h1>
                        <p id="current-date" class="text-xs text-indigo-100 mt-1 font-medium"></p>
                    </div>
                    <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-sm text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                    </div>
                </div>

                <!-- Tombol Input Data Warna Biru -->
                <div class="mt-4 pt-3 border-t border-white/10 flex items-center justify-between">
                    <div class="text-xs text-indigo-100"><span id="total-count" class="font-bold text-white">0</span> Problem Tercatat</div>
                    <button id="btn-open-modal" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-md transition-all duration-200 flex items-center gap-1.5 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Tambah Data
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ================= AREA DISPLAY DATA ================= -->
    <main class="max-w-md mx-auto px-4 mt-4">
        
        <!-- ================= ICON & BADGE FILTER PARETO ================= -->
        <div class="mb-4">
            <button id="btn-open-pareto-modal" class="w-full bg-slate-800/90 hover:bg-slate-800 border border-slate-700/80 rounded-2xl p-3.5 shadow-md flex items-center justify-between transition-all active:scale-[0.99] group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707v4.172a1 1 0 01-1.414.9l-2-1A1 1 0 019 18.414v-4.172a1 1 0 00-.293-.707L2.293 7.293A1 1 0 012 6.586V4z" />
                        </svg>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xs font-semibold text-slate-200">Filter Problem Serupa (Pareto)</h3>
                        <p class="text-[11px] text-slate-400">Klik untuk lihat problem > 3x & Kirim WA</p>
                    </div>
                </div>
                <!-- Badge Jumlah Problem Kembar -->
                <div id="pareto-badge-container" class="hidden">
                    <span id="pareto-badge-count" class="bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-lg animate-pulse">0</span>
                </div>
            </button>
        </div>

        <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm font-semibold text-slate-300">Daftar Log Problem</h2>
            <span class="text-[11px] text-slate-400 italic">Tekan & tahan item untuk Edit/Hapus</span>
        </div>

        <!-- Daftar Card Data -->
        <div id="data-container" class="space-y-3"></div>

        <!-- State Kosong -->
        <div id="empty-state" class="text-center py-12 hidden">
            <div class="w-16 h-16 bg-slate-800 text-slate-500 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                </svg>
            </div>
            <p class="text-sm text-slate-400">Belum ada data problem tercatat.</p>
            <p class="text-xs text-slate-500 mt-1">Tekan tombol "Tambah Data" di atas untuk mulai.</p>
        </div>
    </main>

    <!-- ================= POP-UP DETAIL PARETO & KIRIM WA (KHUSUS > 3 KALI) ================= -->
    <div id="modal-pareto-detail" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl modal-enter max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-slate-700">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-amber-500 rounded-full"></span>
                    Problem
                </h3>
                <button id="btn-close-pareto-modal" class="text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 p-1.5 rounded-full transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <div id="pareto-modal-content" class="overflow-y-auto space-y-3 py-3 pr-1 no-scrollbar flex-1">
                <!-- Konten dinamis problem > 3 kali -->
            </div>

            <div class="pt-3 border-t border-slate-700">
                <button id="btn-close-pareto-bottom" class="w-full bg-slate-900 hover:bg-slate-900/80 text-slate-300 text-xs font-semibold py-2.5 rounded-xl transition-colors">Tutup</button>
            </div>
        </div>
    </div>

    <!-- ================= POP-UP INPUT / EDIT FORM ================= -->
    <div id="modal-form" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-3xl p-5 shadow-2xl modal-enter relative">
            
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 p-1.5 rounded-full transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <h3 id="modal-title" class="text-base font-bold text-white mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-blue-500 rounded-full"></span>
                Tambah Data Problem
            </h3>

            <form id="problem-form" class="space-y-3.5">
                <input type="hidden" id="edit-id">

                <div>
                    <button type="button" id="btn-start-scan" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl shadow transition-all flex items-center justify-center gap-2 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Scan Barcode dengan Kamera
                    </button>
                </div>

                <div id="scanner-container-wrapper" class="hidden relative bg-black rounded-2xl overflow-hidden border border-slate-700">
                    <div id="reader" class="w-full"></div>
                    <button type="button" id="btn-stop-scan" class="absolute bottom-2 right-2 z-20 bg-red-600/80 hover:bg-red-600 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg backdrop-blur-sm">Tutup Kamera</button>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nomor Unit </label>
                    <input type="text" id="unit-number" required placeholder="Contoh: UNIT01" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors uppercase">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Suffix</label>
                    <input type="text" id="suffix-code" required placeholder="Contoh: AB" maxlength="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors uppercase">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Problem / Kendala</label>
                    <textarea id="problem-desc" required rows="2" placeholder="Deskripsikan problem yang muncul..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors resize-none"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm py-2.5 rounded-xl shadow-lg transition-colors active:scale-95">
                        Simpan Data
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= POP-UP ACTION (EDIT / HAPUS) ================= -->
    <div id="modal-action" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl modal-enter">
            <h3 class="text-sm font-bold text-white mb-2">Pilih Aksi Data</h3>
            <p id="action-info" class="text-xs text-slate-400 mb-4 pb-3 border-b border-slate-700"></p>
            <div class="space-y-2">
                <button id="btn-edit-item" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    Edit Data
                </button>
                <button id="btn-delete-item" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2 transition-colors border border-red-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    Hapus Data
                </button>
                <button id="btn-cancel-action" class="w-full bg-slate-900 hover:bg-slate-900/80 text-slate-400 text-xs font-semibold py-2.5 rounded-xl transition-colors">
                    Batal
                </button>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        function getShiftDate(targetDate = new Date()) {
            const d = new Date(targetDate);
            const hours = d.getHours();
            const minutes = d.getMinutes();
            if (hours < 7 || (hours === 7 && minutes < 30)) {
                d.setDate(d.getDate() - 1);
            }
            return d;
        }

        const activeShiftDate = getShiftDate();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = `${activeShiftDate.toLocaleDateString('id-ID', options)}`;

        let problems = JSON.parse(localStorage.getItem('pareto_problems')) || [];
        let selectedId = null;
        let html5QrCode = null;

        const modalForm = document.getElementById('modal-form');
        const modalAction = document.getElementById('modal-action');
        const modalParetoDetail = document.getElementById('modal-pareto-detail');
        const btnOpenModal = document.getElementById('btn-open-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelAction = document.getElementById('btn-cancel-action');
        const btnOpenParetoModal = document.getElementById('btn-open-pareto-modal');
        const btnCloseParetoModal = document.getElementById('btn-close-pareto-modal');
        const btnCloseParetoBottom = document.getElementById('btn-close-pareto-bottom');
        const problemForm = document.getElementById('problem-form');
        const dataContainer = document.getElementById('data-container');
        const emptyState = document.getElementById('empty-state');
        const totalCountEl = document.getElementById('total-count');
        const paretoBadgeContainer = document.getElementById('pareto-badge-container');
        const paretoBadgeCount = document.getElementById('pareto-badge-count');
        const paretoModalContent = document.getElementById('pareto-modal-content');

        btnOpenModal.addEventListener('click', () => {
            document.getElementById('modal-title').innerHTML = '<span class="w-2.5 h-2.5 bg-blue-500 rounded-full"></span> Tambah Data Problem';
            problemForm.reset();
            document.getElementById('edit-id').value = '';
            modalForm.classList.remove('hidden');
        });

        btnCloseModal.addEventListener('click', () => {
            modalForm.classList.add('hidden');
            stopScanner();
        });

        modalForm.addEventListener('click', (e) => {
            if (e.target === modalForm) {
                modalForm.classList.add('hidden');
                stopScanner();
            }
        });

        btnCancelAction.addEventListener('click', () => modalAction.classList.add('hidden'));

        // Pop-up Filter Pareto
        btnOpenParetoModal.addEventListener('click', () => {
            renderParetoModalContent();
            modalParetoDetail.classList.remove('hidden');
        });

        btnCloseParetoModal.addEventListener('click', () => modalParetoDetail.classList.add('hidden'));
        btnCloseParetoBottom.addEventListener('click', () => modalParetoDetail.classList.add('hidden'));
        modalParetoDetail.addEventListener('click', (e) => {
            if (e.target === modalParetoDetail) modalParetoDetail.classList.add('hidden');
        });

        // --- SCANNER BARCODE KAMERA ---
        const btnStartScan = document.getElementById('btn-start-scan');
        const btnStopScan = document.getElementById('btn-stop-scan');
        const scannerWrapper = document.getElementById('scanner-container-wrapper');

        btnStartScan.addEventListener('click', () => {
            scannerWrapper.classList.remove('hidden');
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    processScannedText(decodedText);
                    stopScanner();
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Gagal mengakses kamera: " + err);
                scannerWrapper.classList.add('hidden');
            });
        });

        btnStopScan.addEventListener('click', stopScanner);

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    scannerWrapper.classList.add('hidden');
                }).catch(err => console.error("Gagal menghentikan scanner", err));
            } else {
                scannerWrapper.classList.add('hidden');
            }
        }

        function processScannedText(text) {
            if (text.length >= 17) {
                document.getElementById('unit-number').value = text.substring(11, 17);
            } else if (text.length >= 1) {
                document.getElementById('unit-number').value = text;
            }

            if (text.length >= 6) {
                const char6Back = text.charAt(text.length - 6);
                const char5Back = text.charAt(text.length - 5);
                document.getElementById('suffix-code').value = (char6Back + char5Back).toUpperCase();
            }

            document.getElementById('problem-desc').focus();
        }

        problemForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const unitNumber = document.getElementById('unit-number').value.trim().toUpperCase();
            const suffixCode = document.getElementById('suffix-code').value.trim().toUpperCase();
            const problemDesc = document.getElementById('problem-desc').value.trim();

            const calculatedShiftDate = getShiftDate();
            const formattedDateStr = calculatedShiftDate.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + 
                                     ` (${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })})`;

            if (editId) {
                problems = problems.map(item => item.id == editId ? { ...item, unitNumber, suffixCode, problemDesc } : item);
            } else {
                const newItem = { id: Date.now(), date: formattedDateStr, unitNumber, suffixCode, problemDesc };
                problems.unshift(newItem);
            }

            localStorage.setItem('pareto_problems', JSON.stringify(problems));
            modalForm.classList.add('hidden');
            renderData();
        });

        function renderData() {
            dataContainer.innerHTML = '';
            totalCountEl.innerText = problems.length;

            // Hitung badge untuk problem yang muncul > 3 kali
            const counts = {};
            problems.forEach(p => {
                const key = p.problemDesc.toLowerCase().trim();
                counts[key] = (counts[key] || 0) + 1;
            });

            let alertCount = 0;
            Object.entries(counts).forEach(([prob, val]) => {
                if (val > 3) alertCount += val;
            });

            if (alertCount > 0) {
                paretoBadgeContainer.classList.remove('hidden');
                paretoBadgeCount.innerText = alertCount;
            } else {
                paretoBadgeContainer.classList.add('hidden');
            }

            if (problems.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            problems.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 shadow-md relative overflow-hidden transition-all duration-200 active:scale-[0.98] select-none cursor-pointer";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-cyan-300 font-semibold text-xs px-2.5 py-1">${item.suffixCode} ${item.unitNumber} </span><span class="text-sm text-slate-200 mt-2 font-medium">${escapeHtml(item.problemDesc)}</span>
                        </div>
                        <span class="text-[11px] text-slate-400">${item.date}</span>
                    </div>
                    <p ></p>
                `;

                let pressTimer;
                card.addEventListener('touchstart', () => pressTimer = setTimeout(() => openActionModal(item.id, `${item.unitNumber} - ${item.problemDesc}`), 600));
                card.addEventListener('touchend', () => clearTimeout(pressTimer));
                card.addEventListener('touchmove', () => clearTimeout(pressTimer));

                card.addEventListener('mousedown', () => pressTimer = setTimeout(() => openActionModal(item.id, `${item.unitNumber} - ${item.problemDesc}`), 600));
                card.addEventListener('mouseup', () => clearTimeout(pressTimer));
                card.addEventListener('mouseleave', () => clearTimeout(pressTimer));

                dataContainer.appendChild(card);
            });
        }

        // --- RENDER POP-UP KHUSUS PROBLEM > 3 KALI DENGAN KIRIM WA ---
        function renderParetoModalContent() {
            paretoModalContent.innerHTML = '';

            const grouped = {};
            problems.forEach(p => {
                const key = p.problemDesc.trim();
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(p);
            });

            // Filter HANYA problem yang jumlahnya > 3 kali
            const filteredGroups = Object.entries(grouped).filter(([prob, items]) => items.length > 3);

            if (filteredGroups.length === 0) {
                paretoModalContent.innerHTML = `
                    <div class="text-center py-10">
                        <p class="text-xs text-slate-400">Belum ada problem yang frekuensinya lebih dari 3 kali.</p>
                    </div>
                `;
                return;
            }

            filteredGroups.forEach(([probDesc, items], idx) => {
                const count = items.length;

                // Buat list daftar unit yang mengalami problem ini
                let unitsHtml = '';
                let textListUnits = '';

                items.forEach((it, i) => {
                    unitsHtml += `
                        <div class="flex items-center justify-between bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700/50">
                            <div>
                                <span class="text-[11px] font-bold text-slate-400 mr-2">${i + 1}. </span>
                                <span class="text-xs font-bold text-blue-400">${it.suffixCode} ${it.unitNumber}</span>
                            </div>
                            <span class="text-[10px] text-slate-400">${it.date}</span>
                        </div>
                    `;
                    textListUnits += `${i + 1}. ${it.suffixCode} ${it.unitNumber}\n`;
                });

                // Format Pesan WhatsApp untuk seluruh unit dengan problem yang sama ini
                const waMessage = `*PROBLEM PARETO RM0*\nProblem : *${probDesc}*\nTotal: *${count}* Unit\nDaftar Unit Terkait:\n${textListUnits} Mohon tindak lanjut segera. Terima kasih.`;
                const waLink = `https://wa.me/?text=${encodeURIComponent(waMessage)}`;

                const groupDiv = document.createElement('div');
                groupDiv.className = "bg-slate-900/60 border border-amber-500/30 rounded-2xl p-3.5 space-y-3";
                
                groupDiv.innerHTML = `
                    <div class="flex justify-between items-start pb-2 border-b border-slate-700/60">
                        <div>
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-wide">Problem: ${escapeHtml(probDesc)}</span>
                            <div class="text-[11px] text-slate-400 mt-0.5">Total Kemunculan: <strong class="text-white">${count} Unit</strong></div>
                        </div>
                        <a href="${waLink}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold px-3 py-2 rounded-xl shadow flex items-center gap-1.5 transition-all shrink-0 active:scale-95">

                            Kirim WA Rekap
                        </a>
                    </div>
                    <div class="space-y-1.5">
                        <p class="text-[11px] font-semibold text-slate-400">Daftar Unit Terkait:</p>
                        ${unitsHtml}
                    </div>
                `;

                paretoModalContent.appendChild(groupDiv);
            });
        }

        function openActionModal(id, infoText) {
            selectedId = id;
            document.getElementById('action-info').innerText = infoText;
            modalAction.classList.remove('hidden');
        }

        document.getElementById('btn-edit-item').addEventListener('click', () => {
            modalAction.classList.add('hidden');
            const item = problems.find(p => p.id == selectedId);
            if (item) {
                document.getElementById('modal-title').innerHTML = '<span class="w-2.5 h-2.5 bg-amber-500 rounded-full"></span> Edit Data Problem';
                document.getElementById('edit-id').value = item.id;
                document.getElementById('unit-number').value = item.unitNumber;
                document.getElementById('suffix-code').value = item.suffixCode;
                document.getElementById('problem-desc').value = item.problemDesc;
                modalForm.classList.remove('hidden');
            }
        });

        document.getElementById('btn-delete-item').addEventListener('click', () => {
            modalAction.classList.add('hidden');
            if (confirm("Apakah Anda yakin ingin menghapus data problem ini?")) {
                problems = problems.filter(p => p.id != selectedId);
                localStorage.setItem('pareto_problems', JSON.stringify(problems));
                renderData();
            }
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        renderData();
    </script>
</body>
</html>

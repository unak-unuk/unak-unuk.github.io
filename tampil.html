<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilan Data Unit Repair</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <header class="bg-slate-900 text-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <div class="max-w-2xl mx-auto flex justify-between items-center w-full">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-display mr-2"></i>Monitor Tampilan Data Unit</h1>
            <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg font-medium border border-slate-700">Read-Only Mode</span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Semua Data Unit Terkini</h2>
            <span id="totalData" class="text-xs text-slate-400 font-semibold">Memuat...</span>
        </div>
        <div id="displayContainer" class="space-y-3">
            <div class="text-center py-12 text-slate-400 text-sm bg-white rounded-xl border border-dashed border-slate-200">
                <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><br>Mengambil data dari Spreadsheet...
            </div>
        </div>
    </main>

    <!-- Tombol Riwayat Mengambang -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-3 shadow-lg z-20">
        <div class="max-w-2xl mx-auto flex justify-center">
            <button onclick="bukaModalRiwayat()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-clock-rotate-left"></i> Lihat Berdasarkan Tanggal
            </button>
        </div>
    </div>

    <!-- MODAL RIWAYAT TANGGAL -->
    <div id="modalRiwayatTanggal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden max-h-[85vh] flex flex-col relative">
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-base"><i class="fa-solid fa-calendar-days mr-2"></i>Pilih Tanggal Riwayat</h3>
                <button onclick="tutupModal('modalRiwayatTanggal')" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto space-y-2 flex-1" id="listTanggalContainer"></div>
        </div>
    </div>

    <!-- MODAL DATA PER TANGGAL -->
    <div id="modalDataTanggal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden max-h-[85vh] flex flex-col relative">
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-base" id="judulModalTanggal">Data Tanggal</h3>
                <button onclick="tutupModal('modalDataTanggal')" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto space-y-2.5 flex-1" id="listDataTanggalContainer"></div>
        </div>
    </div>

    <!-- MODAL DETAIL UNIT -->
    <div id="modalDetailUnit" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col relative">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-base"><i class="fa-solid fa-circle-info mr-2"></i>Informasi Lengkap Unit</h3>
                <button onclick="tutupModal('modalDetailUnit')" class="text-indigo-200 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1 text-sm" id="detailUnitContent"></div>
            <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex justify-end">
                <button onclick="tutupModal('modalDetailUnit')" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-lg transition cursor-pointer">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA YANG SAMA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwtznlnSqeNzLYhtdILSrn4JI7wlIE7vSvfJt85jRs-KkIsc2ywCIggkYLpGDNQEmWN5g/exec";

        window.addEventListener('DOMContentLoaded', () => {
            fetch(WEB_APP_URL).then(res => res.json()).then(data => {
                document.getElementById('totalData').textContent = `Total: ${data.length} Data`;
                const container = document.getElementById('displayContainer');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm bg-white rounded-xl border">Belum ada data tersedia.</div>';
                    return;
                }
                container.innerHTML = '';
                data.slice().reverse().forEach(item => {
                    let card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex gap-4 items-start cursor-pointer hover:border-slate-300 transition";
                    card.innerHTML = `
                        <div class="w-20 h-20 bg-slate-100 rounded-lg overflow-hidden shrink-0 flex items-center justify-center border">
                            ${item.fileUrl ? `<img src="${item.fileUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-image text-slate-300"></i>`}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-0.5 rounded">Suffix: ${item.suffix}</span>
                                <span class="bg-slate-100 text-slate-700 text-xs font-bold px-2 py-0.5 rounded">Unit: ${item.nomorUnit}</span>
                            </div>
                            <p class="text-sm font-semibold text-slate-800 truncate">${item.problem}</p>
                            <p class="text-xs text-slate-400 mt-1">Tanggal: ${item.tanggalInput} | Ket: ${item.keteranganGambar || '-'}</p>
                        </div>
                    `;
                    card.onclick = () => tampilkanDetailLengkap(item);
                    container.appendChild(card);
                });
            }).catch(err => {
                document.getElementById('displayContainer').innerHTML = `<div class="text-center py-12 text-red-500 text-sm bg-white rounded-xl border">Gagal memuat data: ${err}</div>`;
            });
        });

        function bukaModalRiwayat() {
            bukaModal('modalRiwayatTanggal');
            const container = document.getElementById('listTanggalContainer');
            container.innerHTML = '<div class="text-center py-6 text-slate-400 text-sm">Memuat...</div>';
            fetch(WEB_APP_URL).then(res => res.json()).then(data => {
                let grouped = {};
                data.forEach(item => {
                    let tgl = item.tanggalInput || "Tanpa Tanggal";
                    if (!grouped[tgl]) grouped[tgl] = [];
                    grouped[tgl].push(item);
                });
                container.innerHTML = '';
                Object.keys(grouped).sort().reverse().forEach(tgl => {
                    let btn = document.createElement('button');
                    btn.className = "w-full text-left p-3.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-xl transition flex justify-between items-center group cursor-pointer";
                    btn.innerHTML = `<span class="font-semibold text-sm text-slate-700">${tgl}</span><span class="bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-full">${grouped[tgl].length} Item</span>`;
                    btn.onclick = () => bukaDataPerTanggal(tgl, grouped[tgl]);
                    container.appendChild(btn);
                });
            });
        }

        function bukaDataPerTanggal(tanggal, items) {
            document.getElementById('judulModalTanggal').textContent = `Riwayat: ${tanggal}`;
            bukaModal('modalDataTanggal');
            const container = document.getElementById('listDataTanggalContainer');
            container.innerHTML = '';
            items.forEach(item => {
                let card = document.createElement('div');
                card.className = "p-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl transition flex gap-3 items-center cursor-pointer";
                card.innerHTML = `
                    <div class="w-12 h-12 bg-white rounded-lg overflow-hidden shrink-0 flex items-center justify-center border">
                        ${item.fileUrl ? `<img src="${item.fileUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-image text-slate-300"></i>`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <span class="text-xs font-bold text-indigo-600">Suffix: ${item.suffix} | Unit: ${item.nomorUnit}</span>
                        <p class="text-xs font-medium text-slate-800 truncate">${item.problem}</p>
                    </div>`;
                card.onclick = () => tampilkanDetailLengkap(item);
                container.appendChild(card);
            });
        }

        function tampilkanDetailLengkap(item) {
            bukaModal('modalDetailUnit');
            document.getElementById('detailUnitContent').innerHTML = `
                <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border">
                    <div><span class="text-xs text-slate-400 block">Suffix</span><strong class="text-indigo-600">${item.suffix}</strong></div>
                    <div><span class="text-xs text-slate-400 block">Nomor Unit</span><strong class="text-slate-800">${item.nomorUnit}</strong></div>
                </div>
                <div><span class="text-xs font-bold text-slate-400 uppercase block mb-1">Waktu:</span><p class="bg-slate-50 p-2.5 rounded-lg border">${item.timestamp}</p></div>
                <div><span class="text-xs font-bold text-slate-400 uppercase block mb-1">Problem:</span><p class="bg-slate-50 p-3 rounded-lg border font-medium">${item.problem}</p></div>
                <div><span class="text-xs font-bold text-slate-400 uppercase block mb-1">Keterangan Gambar:</span><p class="bg-slate-50 p-2.5 rounded-lg border">${item.keteranganGambar || '-'}</p></div>
                ${item.fileUrl ? `<div class="rounded-xl overflow-hidden border bg-slate-100 max-h-50 flex items-center justify-center"><img src="${item.fileUrl}" class="max-h-48 object-contain"></div>` : ''}
            `;
        }

        function bukaModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function tutupModal(id) { document.getElementById(id).classList.remove('flex'); document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Data Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--text-primary);
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        h1 { font-size: 24px; margin-bottom: 5px; color: #f1f5f9; }
        p { color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; }

        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: #111827;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
        }

        tr { transition: background 0.15s; cursor: pointer; }
        tr:hover { background: rgba(59, 130, 246, 0.08); }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
        }
        .badge-ok { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-ng { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.25s ease-out;
        }

        @keyframes modalPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .close-btn:hover { color: var(--text-primary); }

        .modal-body-item {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }
        .modal-body-item span:first-child { color: var(--text-secondary); }
        .modal-body-item span:last-child { font-weight: 600; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-links">
        <a href="index.html" target="_blank">Index (CRUD)</a>
        <a href="view.html" class="active">View Data</a>
        <a href="data.html" target="_blank">Database Console</a>
    </div>

    <h1>Live Data Unit Viewer</h1>
    <p>Klik pada baris unit untuk melihat detail lengkap pemeriksaan.</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>No Urut</th>
                    <th>Suffix</th>
                    <th>Nomor Unit</th>
                    <th>Problem</th>
                </tr>
            </thead>
            <tbody id="viewTableData">
                <tr><td colspan="4" style="text-align:center; color: var(--text-secondary);">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Detail -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="margin-top:0; font-size: 20px; margin-bottom: 20px;">Informasi Detail Unit</h2>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby28sihhGYpIq96nWemrjRh4DW9yw3wqw3GMrW0YbvMA5DzqMbCoU08attU2q1KFCJa/exec';

    document.addEventListener("DOMContentLoaded", () => {
        fetch(API_URL + "?action=get")
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("viewTableData");
                tbody.innerHTML = "";
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-secondary);">Belum ada data tersedia</td></tr>`;
                    return;
                }

                data.forEach((item, index) => {
                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><b>#${index + 1}</b></td>
                        <td>${item.suffix || '-'}</td>
                        <td><code>${item.unitNo || '-'}</code></td>
                        <td>${item.problem || '-'}</td>
                    `;
                    tr.addEventListener("click", () => showInfoModal(item, index + 1));
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById("viewTableData").innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--danger);">Gagal memuat data</td></tr>`;
            });
    });

    function showInfoModal(item, noUrut) {
        let badgeClass = item.status === 'OK' ? 'badge-ok' : 'badge-ng';
        const body = document.getElementById("modalBody");
        body.innerHTML = `
            <div class="modal-body-item"><span>No Urut</span><span>#${noUrut}</span></div>
            <div class="modal-body-item"><span>Suffix</span><span>${item.suffix}</span></div>
            <div class="modal-body-item"><span>Nomor Unit</span><span>${item.unitNo}</span></div>
            <div class="modal-body-item"><span>Problem</span><span>${item.problem}</span></div>
            <div class="modal-body-item"><span>WIP Area</span><span>${item.wip}</span></div>
            <div class="modal-body-item"><span>Status</span><span class="badge ${badgeClass}">${item.status}</span></div>
            <div class="modal-body-item" style="border:none"><span>Waktu Input</span><span style="font-size:12px; color:var(--text-secondary)">${item.timestamp}</span></div>
        `;
        document.getElementById("infoModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("infoModal").style.display = "none";
    }
</script>

</body>
</html>

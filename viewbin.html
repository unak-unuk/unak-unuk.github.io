<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONBin Excel Viewer</title>
    <!-- Tailwind CSS untuk Layout Keseluruhan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS khusus untuk tampilan tabel menyerupai Excel */
        .excel-container {
            overflow: auto;
            background-color: #e6e6e6;
            height: calc(100vh - 64px); /* Dikurangi tinggi navbar/header */
        }
        
        .excel-table {
            border-collapse: collapse;
            font-family: 'Calibri', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            background-color: #fff;
            min-width: 100%;
        }

        .excel-table th, 
        .excel-table td {
            border: 1px solid #d4d4d4;
            padding: 4px 8px;
            white-space: nowrap;
            empty-cells: show;
        }

        .excel-table th {
            background-color: #f3f2f1;
            font-weight: normal;
            text-align: center;
            border-bottom: 1px solid #b4b4b4;
            border-right: 1px solid #b4b4b4;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Styling Nomor Baris (Kiri) */
        .row-number {
            background-color: #f3f2f1 !important;
            color: #666;
            text-align: center !important;
            width: 40px;
            border-right: 1px solid #b4b4b4 !important;
            position: sticky;
            left: 0;
            z-index: 11;
        }
        
        /* Sel Pojok Kiri Atas */
        .excel-table th.corner {
            z-index: 12;
            left: 0;
        }

        .excel-table tr:nth-child(even) td:not(.row-number) {
            background-color: #fafafa;
        }

        .excel-table tr:hover td:not(.row-number) {
            background-color: #e6f2f8; /* Light blue (Excel selection) */
        }

        /* Spinner Animasi */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col font-sans">

    <!-- VIEW 1: LOGIN FORM -->
    <div id="loginView" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="bg-blue-600 p-6 text-white text-center">
                <h1 class="text-2xl font-bold">Data Login</h1>
                <p class="text-blue-100 text-sm mt-1">Hubungkan ke penyimpanan JSONBin.io</p>
            </div>
            
            <form id="loginForm" class="p-6 space-y-5">
                <!-- Error Message Alert -->
                <div id="loginError" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-sm border border-red-200">
                </div>

                <div>
                    <label for="binId" class="block text-sm font-medium text-slate-700 mb-1">JSONBin ID <span class="text-red-500">*</span></label>
                    <input type="text" id="binId" required placeholder="Contoh: 652f8..." 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label for="apiKey" class="block text-sm font-medium text-slate-700 mb-1">API / Access Key (Opsional)</label>
                    <input type="password" id="apiKey" placeholder="Mulai dengan $2a$10$..." 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    <p class="text-xs text-slate-500 mt-1">Kosongkan jika Bin bersifat publik.</p>
                </div>
                
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 mt-4">
                    <span id="loginBtnText">Hubungkan</span>
                </button>
            </form>
        </div>
    </div>

    <!-- VIEW 2: DATA SPREADSHEET -->
    <div id="dataView" class="hidden flex-col h-screen w-full">
        <!-- Header / Navbar -->
        <div class="h-16 bg-white border-b border-slate-200 px-4 md:px-6 flex items-center justify-between shadow-sm shrink-0">
            <div class="flex items-center gap-3">
                <div class="bg-green-600 p-1.5 rounded text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-800 leading-tight">Spreadsheet Viewer</h2>
                    <div class="flex items-center gap-2">
                        <p id="binIdDisplay" class="text-xs text-slate-500 font-mono">Bin: -</p>
                        <span class="text-slate-300">•</span>
                        <p id="lastUpdateDisplay" class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            Auto-sync aktif
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="manualRefresh()" id="refreshBtn" title="Segarkan Data Sekarang" class="text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium px-3 py-2 rounded-lg border border-slate-300 transition-colors flex items-center gap-1.5">
                    <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh
                </button>
                <button onclick="handleLogout()" class="text-sm bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 font-medium px-4 py-2 rounded-lg border border-red-200 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </div>
        </div>

        <!-- Excel Table Container -->
        <div class="excel-container w-full">
            <table class="excel-table" id="excelTable">
                <thead>
                    <tr id="tableHeader">
                        <th class="corner"></th>
                        <!-- Kolom Header Dinamis -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Baris Data Dinamis -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Key untuk LocalStorage
        const STORAGE_ID = 'jsonbin_id';
        const STORAGE_KEY = 'jsonbin_api_key';

        // Variabel untuk interval auto-refresh
        let autoRefreshInterval = null;
        const REFRESH_INTERVAL_TIME = 60000; // 60.000 ms = 1 Menit

        // Pemetaan Header Sesuai Permintaan
        const headerMapping = {
            "id": "ID",
            "suffix": "Suffix",
            "unitNo": "Unit No",
            "problem": "Problem",
            "dateStr": "Tanggal",
            "shift": "Shift",
            "time": "Waktu"
        };

        // DOM Elements
        const loginView = document.getElementById('loginView');
        const dataView = document.getElementById('dataView');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const binIdDisplay = document.getElementById('binIdDisplay');
        const lastUpdateDisplay = document.getElementById('lastUpdateDisplay');
        const refreshIcon = document.getElementById('refreshIcon');

        // Init App (Cek LocalStorage saat halaman dimuat)
        document.addEventListener('DOMContentLoaded', () => {
            const savedId = localStorage.getItem(STORAGE_ID);
            const savedKey = localStorage.getItem(STORAGE_KEY) || '';

            if (savedId) {
                // Jika sudah ada data login, langsung coba hubungkan
                document.getElementById('binId').value = savedId;
                document.getElementById('apiKey').value = savedKey;
                fetchDataAndRender(savedId, savedKey, true, false);
            }
        });

        // Form Submit Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const binId = document.getElementById('binId').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            fetchDataAndRender(binId, apiKey, false, false);
        });

        // Main Fetch Logic
        async function fetchDataAndRender(binId, apiKey, isAutoLogin, isBackgroundRefresh = false) {
            if (!isBackgroundRefresh) {
                setLoading(true);
            }
            hideError();

            try {
                const headers = {};
                if (apiKey) {
                    headers['X-Master-Key'] = apiKey;
                    headers['X-Access-Key'] = apiKey;
                }

                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'GET',
                    headers: headers
                });

                if (!response.ok) {
                    if(response.status === 401 || response.status === 403) {
                        throw new Error("Akses ditolak: API Key tidak valid atau tidak memiliki akses.");
                    } else if (response.status === 404) {
                        throw new Error("JSONBin ID tidak ditemukan.");
                    }
                    throw new Error(`Gagal memuat data (Error ${response.status}).`);
                }

                const json = await response.json();
                
                let dataToRender = [];
                if (json.record) {
                    dataToRender = Array.isArray(json.record) ? json.record : [json.record];
                } else {
                    dataToRender = Array.isArray(json) ? json : [json];
                }

                // Sukses terhubung: Simpan di local storage
                localStorage.setItem(STORAGE_ID, binId);
                localStorage.setItem(STORAGE_KEY, apiKey);

                // Update UI
                binIdDisplay.textContent = `Bin: ${binId}`;
                renderExcelTable(dataToRender);
                
                // Update waktu sinkronisasi terakhir
                const now = new Date();
                const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                lastUpdateDisplay.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Terakhir diperbarui: ${timeString}`;

                switchView('data');

                // Mulai timer auto-refresh 1 menit jika belum aktif
                startAutoRefreshTimer(binId, apiKey);

            } catch (error) {
                if (isAutoLogin && !isBackgroundRefresh) {
                    localStorage.removeItem(STORAGE_ID);
                    localStorage.removeItem(STORAGE_KEY);
                }
                
                if (!isBackgroundRefresh) {
                    showError(error.message);
                } else {
                    // Jika gagal saat background refresh, tampilkan status error kecil
                    lastUpdateDisplay.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Gagal sync (${timeString})`;
                }
            } finally {
                if (!isBackgroundRefresh) {
                    setLoading(false);
                }
            }
        }

        // Fungsi Memulai Timer 1 Menit
        function startAutoRefreshTimer(binId, apiKey) {
            // Hentikan interval lama jika sudah ada agar tidak menumpuk
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }

            // Set interval baru setiap 1 menit (60000 ms)
            autoRefreshInterval = setInterval(() => {
                fetchDataAndRender(binId, apiKey, false, true);
            }, REFRESH_INTERVAL_TIME);
        }

        // Tombol Refresh Manual
        function manualRefresh() {
            const savedId = localStorage.getItem(STORAGE_ID);
            const savedKey = localStorage.getItem(STORAGE_KEY) || '';
            if (savedId) {
                // Beri efek animasi putar pada icon refresh
                refreshIcon.classList.add('animate-spin');
                fetchDataAndRender(savedId, savedKey, false, false).finally(() => {
                    setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);
                });
            }
        }

        // Logic Logout
        function handleLogout() {
            // Hentikan timer auto-refresh saat logout
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }

            // Bersihkan local storage
            localStorage.removeItem(STORAGE_ID);
            localStorage.removeItem(STORAGE_KEY);
            
            // Kosongkan form
            document.getElementById('binId').value = '';
            document.getElementById('apiKey').value = '';
            
            // Kosongkan tabel
            tableHeader.innerHTML = '<th class="corner"></th>';
            tableBody.innerHTML = '';
            
            // Kembali ke halaman login
            switchView('login');
        }

        // Render Data ke Table (Format Excel)
        function renderExcelTable(dataArray) {
            tableHeader.innerHTML = '<th class="corner"></th>';
            tableBody.innerHTML = '';

            if (!dataArray || dataArray.length === 0) {
                tableBody.innerHTML = '<tr><td class="row-number">1</td><td colspan="100%" class="text-slate-400 italic">Data kosong / record tidak ditemukan...</td></tr>';
                return;
            }

            let keys = [];
            dataArray.forEach(row => {
                Object.keys(row).forEach(key => {
                    if (!keys.includes(key)) keys.push(key);
                });
            });

            keys.forEach(key => {
                const th = document.createElement('th');
                th.textContent = headerMapping[key] || (key.charAt(0).toUpperCase() + key.slice(1));
                tableHeader.appendChild(th);
            });

            dataArray.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                const rowNumTd = document.createElement('td');
                rowNumTd.className = 'row-number';
                rowNumTd.textContent = index + 1;
                tr.appendChild(rowNumTd);

                keys.forEach(key => {
                    const td = document.createElement('td');
                    const value = item[key];
                    td.textContent = (value !== null && value !== undefined) ? value : '';
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        // Utility: Navigasi UI
        function switchView(viewName) {
            if (viewName === 'data') {
                loginView.classList.add('hidden');
                dataView.classList.remove('hidden');
                dataView.classList.add('flex');
            } else {
                dataView.classList.add('hidden');
                dataView.classList.remove('flex');
                loginView.classList.remove('hidden');
            }
        }

        // Utility: State Loading Form
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = `<div class="spinner"></div> Menghubungkan...`;
                loginBtn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span id="loginBtnText">Hubungkan</span>`;
                loginBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }

        // Utility: Error UI
        function showError(message) {
            loginError.textContent = message;
            loginError.classList.remove('hidden');
        }

        function hideError() {
            loginError.classList.add('hidden');
            loginError.textContent = '';
        }
    </script>
</body>
</html>

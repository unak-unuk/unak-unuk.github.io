<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONBin Excel Viewer</title>
    <!-- Tailwind CSS untuk Layout Keseluruhan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS khusus untuk tampilan tabel menyerupai Excel */
        .excel-container {
            overflow: auto;
            background-color: #e6e6e6;
            height: calc(100vh - 64px); /* Dikurangi tinggi navbar/header */
            -webkit-overflow-scrolling: touch; /* Scroll lancar di HP */
        }
        
        .excel-table {
            border-collapse: collapse;
            font-family: 'Calibri', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            background-color: #fff;
            min-width: 100%;
        }

        .excel-table th, 
        .excel-table td {
            border: 1px solid #d4d4d4;
            padding: 8px 12px; /* Dibuat sedikit lebih besar agar nyaman disentuh jari di HP */
            white-space: nowrap;
            empty-cells: show;
        }

        .excel-table th {
            background-color: #f3f2f1;
            font-weight: normal;
            text-align: center;
            border-bottom: 1px solid #b4b4b4;
            border-right: 1px solid #b4b4b4;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Styling Nomor Baris (Kiri) */
        .row-number {
            background-color: #f3f2f1 !important;
            color: #666;
            text-align: center !important;
            width: 50px;
            border-right: 1px solid #b4b4b4 !important;
            position: sticky;
            left: 0;
            z-index: 11;
        }
        
        /* Sel Pojok Kiri Atas */
        .excel-table th.corner {
            z-index: 12;
            left: 0;
        }

        .excel-table tr:nth-child(even) td:not(.row-number) {
            background-color: #fafafa;
        }

        .excel-table tr:hover td:not(.row-number) {
            background-color: #e6f2f8;
        }

        /* Spinner Animasi */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col font-sans">

    <!-- VIEW 1: LOGIN FORM -->
    <div id="loginView" class="flex-1 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-md rounded-xl shadow-lg border border-slate-200 overflow-hidden my-auto">
            <div class="bg-blue-600 p-6 text-white text-center">
                <h1 class="text-2xl font-bold">Data Login</h1>
                <p class="text-blue-100 text-sm mt-1">Hubungkan ke penyimpanan JSONBin.io</p>
            </div>
            
            <form id="loginForm" class="p-6 space-y-5">
                <!-- Error Message Alert -->
                <div id="loginError" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-sm border border-red-200">
                </div>

                <div>
                    <label for="binId" class="block text-sm font-medium text-slate-700 mb-1">JSONBin ID <span class="text-red-500">*</span></label>
                    <input type="text" id="binId" required placeholder="Contoh: 652f8..." 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label for="apiKey" class="block text-sm font-medium text-slate-700 mb-1">API / Access Key (Opsional)</label>
                    <input type="password" id="apiKey" placeholder="Mulai dengan $2a$10$..." 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    <p class="text-xs text-slate-500 mt-1">Kosongkan jika Bin bersifat publik.</p>
                </div>
                
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2 mt-4">
                    <span id="loginBtnText">Hubungkan</span>
                </button>
            </form>
        </div>
    </div>

    <!-- VIEW 2: DATA SPREADSHEET -->
    <div id="dataView" class="hidden flex-col h-screen w-full">
        <!-- Header / Navbar (Posisi Tetap / Sticky) -->
        <div class="sticky top-0 z-30 h-auto md:h-16 bg-white border-b border-slate-200 px-3 md:px-6 py-2.5 md:py-0 flex flex-col md:flex-row items-center justify-between gap-2.5 shadow-sm shrink-0">
            <div class="flex items-center justify-between w-full md:w-auto gap-3">
                <div class="flex items-center gap-2.5">
                    <div class="bg-green-600 p-1.5 rounded text-white shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-800 text-sm md:text-base leading-tight">Spreadsheet Viewer</h2>
                        <p id="binIdDisplay" class="text-[11px] md:text-xs text-slate-500 font-mono">Bin: -</p>
                    </div>
                </div>

                <!-- Tombol Logout khusus tampilan mobile di pojok kanan atas navbar -->
                <button onclick="handleLogout()" class="md:hidden text-xs bg-red-50 text-red-600 hover:bg-red-100 font-medium px-3 py-1.5 rounded-lg border border-red-200 transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </div>
            
            <div class="flex items-center justify-between w-full md:w-auto gap-2">
                <!-- Navigasi Switch View Mode -->
                <div class="bg-slate-100 p-1 rounded-lg border border-slate-200 flex items-center gap-1 flex-1 md:flex-initial">
                    <button onclick="switchTableMode('full')" id="btnModeFull" class="flex-1 md:flex-initial text-xs font-medium px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-sm transition-all text-center">
                        Lengkap
                    </button>
                    <button onclick="switchTableMode('summary')" id="btnModeSummary" class="flex-1 md:flex-initial text-xs font-medium px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-800 transition-all text-center">
                        Ringkasan
                    </button>
                </div>

                <!-- Tombol Logout Desktop -->
                <button onclick="handleLogout()" class="hidden md:flex text-sm bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 font-medium px-4 py-2 rounded-lg border border-red-200 transition-colors items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </div>
        </div>

        <!-- Excel Table Container -->
        <div class="excel-container w-full flex-1">
            <table class="excel-table" id="excelTable">
                <thead>
                    <tr id="tableHeader">
                        <th class="corner"></th>
                        <!-- Kolom Header Dinamis -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Baris Data Dinamis -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Key untuk LocalStorage
        const STORAGE_ID = 'jsonbin_id';
        const STORAGE_KEY = 'jsonbin_api_key';

        // Variabel untuk interval auto-refresh & Cache Data & Mode Tampilan
        let autoRefreshInterval = null;
        const REFRESH_INTERVAL_TIME = 60000; // 60.000 ms = 1 Menit (Auto-reload tetap berjalan di latar belakang)
        let cachedData = [];
        let currentMode = 'full'; // 'full' atau 'summary'

        // Pemetaan Header Sesuai Permintaan
        const headerMapping = {
            "id": "ID",
            "suffix": "Suffix",
            "unitNo": "Unit No",
            "problem": "Problem",
            "dateStr": "Tanggal",
            "shift": "Shift",
            "time": "Waktu"
        };

        // DOM Elements
        const loginView = document.getElementById('loginView');
        const dataView = document.getElementById('dataView');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const binIdDisplay = document.getElementById('binIdDisplay');
        const btnModeFull = document.getElementById('btnModeFull');
        const btnModeSummary = document.getElementById('btnModeSummary');

        // Init App (Cek LocalStorage saat halaman dimuat)
        document.addEventListener('DOMContentLoaded', () => {
            const savedId = localStorage.getItem(STORAGE_ID);
            const savedKey = localStorage.getItem(STORAGE_KEY) || '';

            if (savedId) {
                document.getElementById('binId').value = savedId;
                document.getElementById('apiKey').value = savedKey;
                fetchDataAndRender(savedId, savedKey, true, false);
            }
        });

        // Form Submit Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const binId = document.getElementById('binId').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            fetchDataAndRender(binId, apiKey, false, false);
        });

        // Main Fetch Logic
        async function fetchDataAndRender(binId, apiKey, isAutoLogin, isBackgroundRefresh = false) {
            if (!isBackgroundRefresh) {
                setLoading(true);
            }
            hideError();

            try {
                const headers = {};
                if (apiKey) {
                    headers['X-Master-Key'] = apiKey;
                    headers['X-Access-Key'] = apiKey;
                }

                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'GET',
                    headers: headers
                });

                if (!response.ok) {
                    if(response.status === 401 || response.status === 403) {
                        throw new Error("Akses ditolak: API Key tidak valid atau tidak memiliki akses.");
                    } else if (response.status === 404) {
                        throw new Error("JSONBin ID tidak ditemukan.");
                    }
                    throw new Error(`Gagal memuat data (Error ${response.status}).`);
                }

                const json = await response.json();
                
                let dataToRender = [];
                if (json.record) {
                    dataToRender = Array.isArray(json.record) ? json.record : [json.record];
                } else {
                    dataToRender = Array.isArray(json) ? json : [json];
                }

                cachedData = dataToRender;

                localStorage.setItem(STORAGE_ID, binId);
                localStorage.setItem(STORAGE_KEY, apiKey);

                binIdDisplay.textContent = `Bin: ${binId}`;
                renderActiveTable();
                
                switchView('data');
                startAutoRefreshTimer(binId, apiKey);

            } catch (error) {
                if (isAutoLogin && !isBackgroundRefresh) {
                    localStorage.removeItem(STORAGE_ID);
                    localStorage.removeItem(STORAGE_KEY);
                }
                
                if (!isBackgroundRefresh) {
                    showError(error.message);
                }
            } finally {
                if (!isBackgroundRefresh) {
                    setLoading(false);
                }
            }
        }

        // Fungsi Switch Mode Tampilan Tabel
        function switchTableMode(mode) {
            currentMode = mode;
            if (mode === 'full') {
                btnModeFull.className = "flex-1 md:flex-initial text-xs font-medium px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-sm transition-all text-center";
                btnModeSummary.className = "flex-1 md:flex-initial text-xs font-medium px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-800 transition-all text-center";
            } else {
                btnModeSummary.className = "flex-1 md:flex-initial text-xs font-medium px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-sm transition-all text-center";
                btnModeFull.className = "flex-1 md:flex-initial text-xs font-medium px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-800 transition-all text-center";
            }
            renderActiveTable();
        }

        // Render Tabel Sesuai Mode Aktif
        function renderActiveTable() {
            if (currentMode === 'full') {
                renderExcelTable(cachedData);
            } else {
                renderSummaryTable(cachedData);
            }
        }

        // Fungsi Memulai Timer 1 Menit (Background Refresh)
        function startAutoRefreshTimer(binId, apiKey) {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            autoRefreshInterval = setInterval(() => {
                fetchDataAndRender(binId, apiKey, false, true);
            }, REFRESH_INTERVAL_TIME);
        }

        // Logic Logout
        function handleLogout() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
            localStorage.removeItem(STORAGE_ID);
            localStorage.removeItem(STORAGE_KEY);
            
            document.getElementById('binId').value = '';
            document.getElementById('apiKey').value = '';
            
            tableHeader.innerHTML = '<th class="corner"></th>';
            tableBody.innerHTML = '';
            cachedData = [];
            
            switchView('login');
        }

        // Render Tabel Lengkap (Mode Full)
        function renderExcelTable(dataArray) {
            tableHeader.innerHTML = '<th class="corner"></th>';
            tableBody.innerHTML = '';

            if (!dataArray || dataArray.length === 0) {
                tableBody.innerHTML = '<tr><td class="row-number">1</td><td colspan="100%" class="text-slate-400 italic">Data kosong / record tidak ditemukan...</td></tr>';
                return;
            }

            let keys = [];
            dataArray.forEach(row => {
                Object.keys(row).forEach(key => {
                    if (!keys.includes(key)) keys.push(key);
                });
            });

            keys.forEach(key => {
                const th = document.createElement('th');
                th.textContent = headerMapping[key] || (key.charAt(0).toUpperCase() + key.slice(1));
                tableHeader.appendChild(th);
            });

            dataArray.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                const rowNumTd = document.createElement('td');
                rowNumTd.className = 'row-number';
                rowNumTd.textContent = index + 1;
                tr.appendChild(rowNumTd);

                keys.forEach(key => {
                    const td = document.createElement('td');
                    const value = item[key];
                    td.textContent = (value !== null && value !== undefined) ? value : '';
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        // Render Tabel Ringkasan (Mode Summary: No, Unit [suffix-unitNo], Problem)
        function renderSummaryTable(dataArray) {
            tableHeader.innerHTML = '<th class="corner"></th>';
            tableBody.innerHTML = '';

            if (!dataArray || dataArray.length === 0) {
                tableBody.innerHTML = '<tr><td class="row-number">1</td><td colspan="2" class="text-slate-400 italic">Data kosong / record tidak ditemukan...</td></tr>';
                return;
            }

            const summaryHeaders = ["Unit", "Problem"];
            summaryHeaders.exceptions = true;
            summaryHeaders.forEach(text => {
                const th = document.createElement('th');
                th.textContent = text;
                tableHeader.appendChild(th);
            });

            dataArray.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                const rowNumTd = document.createElement('td');
                rowNumTd.className = 'row-number';
                rowNumTd.textContent = index + 1;
                tr.appendChild(rowNumTd);

                const suffix = item['suffix'] !== undefined && item['suffix'] !== null ? String(item['suffix']).trim() : '';
                const unitNo = item['unitNo'] !== undefined && item['unitNo'] !== null ? String(item['unitNo']).trim() : '';
                
                let combinedUnit = '';
                if (suffix && unitNo) {
                    combinedUnit = `${suffix}-${unitNo}`;
                } else {
                    combinedUnit = suffix || unitNo || '';
                }

                const unitTd = document.createElement('td');
                unitTd.textContent = combinedUnit;
                unitTd.className = 'font-semibold text-slate-700';
                tr.appendChild(unitTd);

                const problemTd = document.createElement('td');
                const problemVal = item['problem'];
                problemTd.textContent = (problemVal !== null && problemVal !== undefined) ? problemVal : '';
                tr.appendChild(problemTd);

                tableBody.appendChild(tr);
            });
        }

        // Utility: Navigasi UI
        function switchView(viewName) {
            if (viewName === 'data') {
                loginView.classList.add('hidden');
                dataView.classList.remove('hidden');
                dataView.classList.add('flex');
            } else {
                dataView.classList.add('hidden');
                dataView.classList.remove('flex');
                loginView.classList.remove('hidden');
            }
        }

        // Utility: State Loading Form
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = `<div class="spinner"></div> Menghubungkan...`;
                loginBtn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span id="loginBtnText">Hubungkan</span>`;
                loginBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }

        // Utility: Error UI
        function showError(message) {
            loginError.textContent = message;
            loginError.classList.remove('hidden');
        }

        function hideError() {
            loginError.classList.add('hidden');
            loginError.textContent = '';
        }
    </script>
</body>
</html>
